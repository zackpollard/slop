name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-infra:
    name: Wait for infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Wait for infra workflow to complete
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            // Find the infra workflow
            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo });
            const infraWorkflow = workflows.data.workflows.find(w => w.path === '.github/workflows/infra.yml');
            if (!infraWorkflow) {
              console.log('No infra workflow found, proceeding');
              return;
            }

            // Check for in-progress or queued runs on the same commit
            const pollInterval = 15000; // 15 seconds
            const maxWait = 600000; // 10 minutes
            let waited = 0;

            while (waited < maxWait) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: infraWorkflow.id,
                head_sha: sha,
                per_page: 5,
              });

              const activeRuns = runs.data.workflow_runs.filter(
                r => r.status === 'in_progress' || r.status === 'queued'
              );

              if (activeRuns.length === 0) {
                // Check if any completed runs failed
                const completedRuns = runs.data.workflow_runs.filter(
                  r => r.status === 'completed'
                );
                if (completedRuns.length > 0 && completedRuns[0].conclusion === 'failure') {
                  core.setFailed('Infrastructure workflow failed — aborting deploy');
                  return;
                }
                console.log('No active infra workflow runs, proceeding with deploy');
                return;
              }

              console.log(`Infra workflow still running (${activeRuns.length} active run(s)), waiting ${pollInterval / 1000}s...`);
              await new Promise(r => setTimeout(r, pollInterval));
              waited += pollInterval;
            }

            core.setFailed('Timed out waiting for infra workflow to complete');

  deploy:
    name: Deploy ${{ matrix.project.name }}
    needs: wait-for-infra
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: homepage
            pages-project: slop-homepage
            directory: projects/homepage
          - name: roof-calculator
            pages-project: slop-roof-calculator
            directory: projects/roof-calculator
          - name: dnd-encounter-generator
            pages-project: slop-dnd-encounter-generator
            directory: projects/dnd-encounter-generator
          - name: cron
            pages-project: slop-cron
            directory: projects/cron
          - name: subnet
            pages-project: slop-subnet
            directory: projects/subnet
          - name: json
            pages-project: slop-json
            directory: projects/json
          - name: flip-7
            pages-project: slop-flip-7
            directory: projects/flip-7
          - name: uno-no-mercy
            pages-project: slop-uno-no-mercy
            directory: projects/uno-no-mercy
          - name: exploding-kittens
            pages-project: slop-exploding-kittens
            directory: projects/exploding-kittens
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ matrix.project.directory }} --project-name=${{ matrix.project.pages-project }} --branch=main
