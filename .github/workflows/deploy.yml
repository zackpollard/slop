name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "lib/**"
      - "tofu/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "tofu/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tofu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.8

      - name: Init
        run: |
          cat > backend.conf <<EOF
          access_key = "${{ secrets.R2_ACCESS_KEY_ID }}"
          secret_key = "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          endpoints = {
            s3 = "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF
          tofu init -backend-config=backend.conf
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Plan
        id: plan
        run: |
          tofu plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          {
            echo 'plan<<EOF'
            cat plan_output.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        with:
          script: |
            const plan = process.env.PLAN;

            const body = [
              '### OpenTofu Plan',
              '',
              '<details>',
              '<summary>Plan output</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### OpenTofu Plan')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: tofu apply -auto-approve tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy ${{ matrix.project.name }}
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: infra
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: homepage
            pages-project: slop-homepage
            directory: projects/homepage
          - name: roof-calculator
            pages-project: slop-roof-calculator
            directory: projects/roof-calculator
          - name: dnd-encounter-generator
            pages-project: slop-dnd-encounter-generator
            directory: projects/dnd-encounter-generator
          - name: dnd-banners
            pages-project: slop-dnd-banners
            directory: projects/dnd-banners
          - name: cron
            pages-project: slop-cron
            directory: projects/cron
          - name: subnet
            pages-project: slop-subnet
            directory: projects/subnet
          - name: json
            pages-project: slop-json
            directory: projects/json
          - name: flip-7
            pages-project: slop-flip-7
            directory: projects/flip-7
          - name: uno-no-mercy
            pages-project: slop-uno-no-mercy
            directory: projects/uno-no-mercy
          - name: exploding-kittens
            pages-project: slop-exploding-kittens
            directory: projects/exploding-kittens
          - name: herd-mentality
            pages-project: slop-herd-mentality
            directory: projects/herd-mentality
          - name: texas-holdem
            pages-project: slop-texas-holdem
            directory: projects/texas-holdem
          - name: cards-against-humanity
            pages-project: slop-cards-against-humanity
            directory: projects/cards-against-humanity
          - name: waze-beep-sound-pack
            pages-project: slop-waze-beep-sound-pack
            directory: projects/waze-beep-sound-pack
          - name: unifi-store
            pages-project: slop-unifi-store
            directory: projects/unifi-store
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy shared libraries
        run: |
          # Copy shared libraries into projects that use PeerJS networking
          for project in texas-holdem cards-against-humanity herd-mentality flip-7; do
            if [ -d "projects/$project" ]; then
              mkdir -p "projects/$project/lib"
              cp lib/slopnet/slopnet.js "projects/$project/lib/slopnet.js"
              cp lib/sloplobby/sloplobby.js "projects/$project/lib/sloplobby.js"
              cp lib/slop-theme.css "projects/$project/lib/slop-theme.css"
            fi
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ matrix.project.directory }} --project-name=${{ matrix.project.pages-project }} --branch=main
