# Builds the beeps-only Waze voice pack, uploads it to Waze, and publishes the
# resulting install link (https://waze.com/ul?acvp=<UUID>) into the deployed
# site by committing install-link.json to main and triggering the deploy
# workflow.
#
# Heads up:
#   * This impersonates the Waze app against its private endpoints via a
#     reverse-engineered protobuf protocol (the cloned GPLv3 tool below). It
#     likely violates Waze's ToS and is inherently fragile — pinned to a Waze
#     app version, it will break when Waze changes the protocol. It needs no
#     Waze account: the uploader uses an anonymous session.
#   * The uploader is GPLv3, so it is cloned and run at build time rather than
#     vendored into this repo (which would impose GPL on the repo).
#   * Dispatch from main for the cleanest result (the rendered beeps and the
#     install link then come from the same revision the site will serve).
name: Waze Pack

on:
  workflow_dispatch:
    inputs:
      pack_name:
        description: "Folder name used for the uploaded pack"
        default: "slop-beeps"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: waze-pack
  cancel-in-progress: true

env:
  TOOL: ${{ github.workspace }}/_tool
  PACK_NAME: ${{ inputs.pack_name }}

jobs:
  build-upload-publish:
    name: Build, upload, and publish install link
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 3.8 has prebuilt wheels for the uploader's pinned protobuf==3.10.0
          python-version: "3.8"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Clone Waze voicepack uploader (GPLv3)
        run: |
          git clone --depth 1 https://github.com/pipeeeeees/waze-voicepack-links "$TOOL"
          echo "Cloned uploader at: $(git -C "$TOOL" rev-parse HEAD)"

      - name: Install uploader dependencies
        run: pip install -r "$TOOL/requirements.txt"

      - name: Render beeps to WAV (headless Chromium)
        working-directory: projects/waze-beep-sound-pack/scripts
        run: |
          npm install
          npx playwright install --with-deps chromium
          node render-wavs.mjs "$GITHUB_WORKSPACE/_wavs"

      - name: Build MP3 pack
        run: |
          node projects/waze-beep-sound-pack/scripts/build-pack.mjs \
            "$GITHUB_WORKSPACE/_wavs" \
            "$TOOL/mp3_upload/input_packs/$PACK_NAME"

      - name: Upload to Waze
        id: upload
        run: |
          set -o pipefail
          cd "$TOOL"
          python mp3_upload/main.py | tee "$GITHUB_WORKSPACE/upload.log"
          link=$(grep -oE 'https://waze\.com/ul\?acvp=[0-9a-fA-F-]+' "$GITHUB_WORKSPACE/upload.log" | head -1 || true)
          echo "link=$link" >> "$GITHUB_OUTPUT"

      - name: Publish install link to main
        if: steps.upload.outputs.link != ''
        env:
          LINK: ${{ steps.upload.outputs.link }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          cat > projects/waze-beep-sound-pack/install-link.json <<EOF
          {
            "link": "$LINK",
            "uploaded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_id": "${{ github.run_id }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/waze-beep-sound-pack/install-link.json
          if git diff --staged --quiet; then
            echo "Install link unchanged; skipping commit."
          else
            git commit -m "chore(waze-beep-sound-pack): update install link"
            git push origin main
            # Pushes made with the default GITHUB_TOKEN do not trigger other
            # workflows, so nudge the deploy workflow explicitly.
            gh workflow run deploy.yml --ref main
          fi

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Waze beeps pack"
            if [ -n "${{ steps.upload.outputs.link }}" ]; then
              echo ""
              echo "**Install link:** ${{ steps.upload.outputs.link }}"
              echo ""
              echo "Published to \`projects/waze-beep-sound-pack/install-link.json\` on main; deploy workflow nudged."
            else
              echo ""
              echo "No \`acvp\` link was captured — check the **upload-log** artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waze-pack
          path: |
            _tool/mp3_upload/input_packs/${{ env.PACK_NAME }}/
            upload.log
          if-no-files-found: warn
