<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Texas Hold'em — slop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script src="lib/slopnet.js"></script>
    <script src="lib/sloplobby.js"></script>
    <link rel="stylesheet" href="lib/slop-theme.css">
    <style>
        /* Game-specific styles — base theme loaded from lib/slop-theme.css */

        :root {
            --color-red: #d44;
            --color-green: #2a6e3f;
        }

        /* Full-screen app overrides */
        html, body {
            height: 100%;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .screen { display: none; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        /* ── Button overrides ── */
        .btn {
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.15s, border-color 0.15s;
            -webkit-user-select: none;
        }
        .btn:hover { background: var(--color-surface); border-color: var(--color-border); }
        .btn:active { background: var(--color-surface-hover); }
        .btn-primary { color: var(--color-bg); }
        .btn-primary:hover { background: var(--color-accent); border-color: var(--color-accent); }
        .btn-primary:active { background: #b3932e; }
        .btn-success { color: var(--color-success); border-color: var(--color-success); }
        .btn-full { width: 100%; margin-top: 0.75rem; }

        /* ── Input overrides ── */
        input[type="text"], input[type="number"] {
            font-family: var(--font-mono);
            font-size: 1rem;
            padding: 0.6rem 0.75rem;
        }

        /* ── Lobby Screen ── */
        #lobby {
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            gap: 1.5rem;
            overflow-y: auto;
        }

        #lobby h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
        }
        #lobby h1 .accent { color: var(--color-accent); }

        .lobby-section {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 1.25rem;
            width: 100%;
            max-width: 400px;
        }

        .lobby-section h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--color-accent);
        }

        .lobby-section label {
            display: block;
            margin-bottom: 0.25rem;
            margin-top: 0.5rem;
        }
        .lobby-section label:first-of-type { margin-top: 0; }

        /* ── Waiting Room ── */
        #waiting-room {
            padding: 1.5rem;
            align-items: center;
        }

        .room-code-display { margin: 1rem 0; }
        .room-code-display .code { letter-spacing: 0.15em; }
        .room-code-display p {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-top: 0.25rem;
        }

        .player-list {
            width: 100%;
            max-width: 400px;
            margin: 1rem 0;
            flex-wrap: nowrap;
            flex-direction: column;
        }
        .player-list h3 {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            margin-bottom: 0.5rem;
        }
        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.75rem;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }
        .player-item .host-badge {
            font-size: 0.75rem;
            background: var(--color-accent-dim);
            color: var(--color-accent);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }
        .player-item .disconnected-badge {
            font-size: 0.75rem;
            background: rgba(196, 94, 78, 0.15);
            color: var(--color-error);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }

        .waiting-status {
            color: var(--color-text-muted);
            font-size: 0.9rem;
            text-align: center;
        }

        /* ── Game Screen ── */
        #game {
            position: relative;
            overflow: hidden;
        }

        .game-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0.5rem 0.75rem;
            z-index: 10;
        }

        .game-info {
            display: flex;
            /* Three pills (blinds, pot, turn clock) plus the Menu button do not fit on a
               320px phone in one row — let them wrap rather than clip. */
            flex-wrap: wrap;
            gap: 0.35rem 0.75rem;
            min-width: 0;
            font-size: 0.8rem;
            font-family: var(--font-mono);
        }
        .game-info span {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 0.25rem 0.5rem;
        }
        .game-info .pot-display { color: var(--color-accent); }
        .game-info .turn-timer { color: var(--color-text-muted); }

        .menu-btn {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            color: var(--color-text-muted);
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* ── Table area ── */
        .table-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
        }

        /* Opponents around the top */
        .opponents {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4rem;
            padding: 0 0.5rem;
            width: 100%;
            max-width: 500px;
        }

        .opponent {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 0.3rem 0.5rem;
            min-width: 70px;
            max-width: 90px;
            position: relative;
            transition: border-color 0.3s;
        }
        .opponent.active-turn {
            border-color: var(--color-accent);
            box-shadow: 0 0 8px var(--color-accent-dim);
        }
        .opponent.folded { opacity: 0.4; }
        .opponent.disconnected { border-color: var(--color-error); border-style: dashed; }

        .opponent .name {
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
        }
        .opponent .chips {
            font-size: 0.65rem;
            font-family: var(--font-mono);
            color: var(--color-accent);
        }
        .opponent .bet-amount {
            font-size: 0.6rem;
            font-family: var(--font-mono);
            color: var(--color-text-muted);
        }
        .opponent .opp-cards {
            display: flex;
            gap: 2px;
            margin: 2px 0;
        }
        .opponent .dealer-chip {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--color-accent);
            color: var(--color-bg);
            font-size: 0.55rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .opponent .hand-label {
            font-size: 0.55rem;
            color: var(--color-success);
            font-weight: 600;
            margin-top: 1px;
        }

        /* Community cards */
        .community {
            display: flex;
            gap: 0.35rem;
            margin: 0.75rem 0;
            justify-content: center;
        }

        .pot-label {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--color-accent);
            text-align: center;
            margin-bottom: 0.25rem;
        }

        .side-pots {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            font-size: 0.7rem;
            font-family: var(--font-mono);
            color: var(--color-text-muted);
            margin-bottom: 0.25rem;
        }

        /* Cards */
        .card {
            width: 36px;
            height: 50px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.75rem;
            line-height: 1;
            border: 1px solid #555;
            flex-shrink: 0;
        }
        .card.face-up {
            background: #f5f0e6;
            color: #222;
        }
        .card.face-up.red { color: var(--color-red); }
        .card.face-down {
            background: linear-gradient(135deg, #2a4a7f 25%, #1e3a6e 50%, #2a4a7f 75%);
            border-color: #3a5a8f;
        }
        .card.face-down::after {
            content: '';
            width: 20px;
            height: 28px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 2px;
        }
        .card.placeholder {
            background: rgba(255,255,255,0.03);
            border: 1px dashed #333;
        }
        .card .rank { font-size: 0.85rem; }
        .card .suit { font-size: 0.7rem; margin-top: -1px; }

        .card-large {
            width: 52px;
            height: 72px;
            font-size: 1rem;
        }
        .card-large .rank { font-size: 1.15rem; }
        .card-large .suit { font-size: 0.95rem; }

        /* Player's hand (bottom) */
        .my-area {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: var(--color-surface);
            border-top: 1px solid var(--color-border);
        }

        .my-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }

        .my-info .my-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .my-info .my-chips {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--color-accent);
        }
        .my-info .my-hand-label {
            font-size: 0.8rem;
            color: var(--color-success);
            font-weight: 500;
        }

        .my-cards {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 0.4rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .actions .btn {
            flex: 1;
            min-width: 60px;
            max-width: 120px;
            padding: 0.55rem 0.5rem;
            font-size: 0.85rem;
        }

        .raise-controls {
            display: flex;
            gap: 0.3rem;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.4rem;
        }
        .raise-controls input[type="range"] {
            flex: 1;
            max-width: 180px;
            accent-color: var(--color-accent);
        }
        .raise-controls .raise-amount {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            min-width: 50px;
            text-align: center;
            color: var(--color-accent);
        }
        .raise-presets {
            display: flex;
            gap: 0.25rem;
            justify-content: center;
            margin-bottom: 0.3rem;
        }
        .raise-presets .btn {
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            min-width: auto;
        }

        /* Winner announcement */
        .announcement {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 12, 0.92);
            border: 2px solid var(--color-accent);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            text-align: center;
            z-index: 50;
            min-width: 220px;
            display: none;
        }
        .announcement.show { display: block; }
        .announcement h3 {
            color: var(--color-accent);
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }
        .announcement p {
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        /* Game over overlay */
        .game-over-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 15, 12, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            gap: 1rem;
            padding: 2rem;
        }
        .game-over-overlay.show { display: flex; }
        .game-over-overlay h2 { color: var(--color-accent); font-size: 1.8rem; }
        .game-over-overlay p { color: var(--color-text-muted); font-size: 1rem; }

        /* Toast notifications — override shared bottom-toast with top-toast system */
        .toast-container {
            position: fixed;
            top: 0.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            pointer-events: none;
        }
        .toast {
            position: static;
            transform: none;
            transition: none;
            bottom: auto;
            left: auto;
            max-width: none;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: normal;
            color: var(--color-text);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
            pointer-events: auto;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

        /* Game menu overlay */
        .game-menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 15, 12, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 80;
            gap: 0.75rem;
            padding: 2rem;
        }
        .game-menu-overlay.show { display: flex; }
        .game-menu-overlay .btn { min-width: 200px; }
        .game-menu-overlay .menu-hint {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            text-align: center;
        }
        .game-menu-overlay .menu-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            align-items: center;
            margin-top: 0.4rem;
            max-height: 30vh;
            overflow-y: auto;
        }
        #host-controls {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            align-items: center;
        }

        /* Scrollable for many opponents */
        @media (max-height: 600px) {
            .opponents { gap: 0.25rem; }
            .opponent { padding: 0.2rem 0.4rem; min-width: 60px; }
            .community { margin: 0.4rem 0; }
            .card-large { width: 44px; height: 60px; }
        }
    </style>
</head>
<body>
    <!-- Lobby -->
    <div id="lobby" class="screen active">
        <h1>Texas <span class="accent">Hold'em</span></h1>

        <div class="lobby-section">
            <h2>Create Table</h2>
            <label for="host-name">Your Name</label>
            <input type="text" id="host-name" placeholder="Name" maxlength="12">
            <label for="buy-in">Starting Chips</label>
            <input type="number" id="buy-in" value="1000" min="100" step="100">
            <label for="blinds">Blinds (Small / Big)</label>
            <div style="display:flex;gap:0.5rem;">
                <input type="number" id="small-blind" value="5" min="1" style="flex:1;">
                <input type="number" id="big-blind" value="10" min="2" style="flex:1;">
            </div>
            <button class="btn btn-primary btn-full" id="btn-create">Create Table</button>
        </div>

        <div class="lobby-section">
            <h2>Join Table</h2>
            <label for="join-name">Your Name</label>
            <input type="text" id="join-name" placeholder="Name" maxlength="12">
            <label for="room-code">Room Code</label>
            <input type="text" id="room-code" placeholder="Enter code" maxlength="6" style="text-transform:uppercase;">
            <label for="rejoin-code">Seat Code <span style="color:var(--color-text-muted);font-weight:400;">(only if you are coming back)</span></label>
            <input type="text" id="rejoin-code" placeholder="Optional" maxlength="4" style="text-transform:uppercase;">
            <button class="btn btn-primary btn-full" id="btn-join">Join Table</button>
        </div>
    </div>

    <!-- Waiting Room -->
    <div id="waiting-room" class="screen">
        <h1 style="font-size:1.3rem;text-align:center;">Waiting for Players</h1>
        <div class="room-code-display">
            <div class="code" id="display-code" title="Tap to copy"></div>
            <p>Share this code with other players</p>
        </div>
        <div class="player-list" id="waiting-player-list">
            <h3>Players</h3>
        </div>
        <button class="btn btn-primary" id="btn-start-game" style="max-width:300px;width:100%;">Start Game</button>
        <p class="waiting-status" id="waiting-status"></p>
    </div>

    <!-- Game -->
    <div id="game" class="screen">
        <div class="game-top">
            <div class="game-info">
                <span>Blinds <span id="blinds-display"></span></span>
                <span class="pot-display">Pot <span id="pot-display">0</span></span>
                <span class="turn-timer" id="turn-timer" style="display:none;"></span>
            </div>
            <button class="menu-btn" id="btn-menu">Menu</button>
        </div>

        <div class="table-area">
            <div class="opponents" id="opponents"></div>

            <div class="side-pots" id="side-pots"></div>
            <div class="pot-label" id="main-pot-label"></div>
            <div class="community" id="community"></div>

            <div class="announcement" id="announcement">
                <h3 id="announce-title"></h3>
                <p id="announce-text"></p>
            </div>
        </div>

        <div class="my-area" id="my-area">
            <div class="my-info">
                <span class="my-name" id="my-name"></span>
                <span class="my-hand-label" id="my-hand-label"></span>
                <span class="my-chips" id="my-chips"></span>
            </div>
            <div class="my-cards" id="my-cards"></div>
            <div class="raise-presets" id="raise-presets" style="display:none;">
                <button class="btn" data-preset="min">Min</button>
                <button class="btn" data-preset="0.33">1/3 Pot</button>
                <button class="btn" data-preset="0.5">1/2 Pot</button>
                <button class="btn" data-preset="1">Pot</button>
                <button class="btn" data-preset="max">All In</button>
            </div>
            <div class="raise-controls" id="raise-controls" style="display:none;">
                <input type="range" id="raise-slider" min="0" max="1000" value="0">
                <span class="raise-amount" id="raise-amount">0</span>
            </div>
            <div class="actions" id="actions"></div>
        </div>
    </div>

    <!-- Game Menu Overlay -->
    <div class="game-menu-overlay" id="game-menu">
        <button class="btn" id="btn-menu-close">Resume</button>
        <p class="menu-hint" id="menu-seat-codes"></p>
        <div id="host-controls" style="display:none;">
            <p class="menu-hint">Table controls</p>
            <div id="menu-fold-current" class="menu-group"></div>
            <div id="menu-remove-list" class="menu-group"></div>
        </div>
        <button class="btn btn-danger" id="btn-leave">Leave Table</button>
    </div>

    <!-- Game Over Overlay -->
    <div class="game-over-overlay" id="game-over">
        <h2 id="game-over-title"></h2>
        <p id="game-over-text"></p>
        <button class="btn btn-primary" id="btn-back-lobby">Back to Lobby</button>
    </div>

    <!-- Toasts -->
    <div class="toast-container" id="toasts"></div>

    <script>
    'use strict';

    /* ══════════════════════════════════════════════════════════════
       UTILITIES
       ══════════════════════════════════════════════════════════════ */
    const $ = (sel, ctx = document) => ctx.querySelector(sel);
    const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

    const toast = SlopLobby.toast;

    function showScreen(id) {
        $$('.screen').forEach(s => s.classList.remove('active'));
        $(`#${id}`).classList.add('active');
    }

    /* ══════════════════════════════════════════════════════════════
       CARD & DECK
       ══════════════════════════════════════════════════════════════ */
    const SUITS = ['s', 'h', 'd', 'c'];
    const SUIT_SYMBOLS = { s: '\u2660', h: '\u2665', d: '\u2666', c: '\u2663' };
    const SUIT_RED = { s: false, h: true, d: true, c: false };
    const RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
    const RANK_DISPLAY = { T: '10', J: 'J', Q: 'Q', K: 'K', A: 'A' };

    function newDeck() {
        const deck = [];
        for (const s of SUITS) for (const r of RANKS) deck.push(r + s);
        return deck;
    }

    function shuffleDeck(deck) {
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        return deck;
    }

    function cardRank(card) { return RANKS.indexOf(card[0]); }
    function cardSuit(card) { return card[1]; }

    function renderCard(card, large = false) {
        if (!card) {
            const el = document.createElement('div');
            el.className = `card placeholder${large ? ' card-large' : ''}`;
            return el;
        }
        if (card === 'back') {
            const el = document.createElement('div');
            el.className = `card face-down${large ? ' card-large' : ''}`;
            return el;
        }
        const r = card[0], s = card[1];
        const el = document.createElement('div');
        el.className = `card face-up${large ? ' card-large' : ''}${SUIT_RED[s] ? ' red' : ''}`;
        el.innerHTML = `<span class="rank">${RANK_DISPLAY[r] || r}</span><span class="suit">${SUIT_SYMBOLS[s]}</span>`;
        return el;
    }

    /* ══════════════════════════════════════════════════════════════
       HAND EVALUATOR
       Returns { rank: 0-8, value: [comparable array], name: string }
       Higher rank = better hand. Rank 8 = Royal Flush.
       ══════════════════════════════════════════════════════════════ */
    function evaluateBestHand(holeCards, communityCards) {
        const all = [...holeCards, ...communityCards];
        // Hard cap on the input: this is C(n,5) work, and the client runs it on
        // arrays that arrived over the wire. Seven cards is 21 combinations; sixty
        // would be 5.4 million and would wedge the tab on every repaint.
        if (all.length < 5 || all.length > 7) return { rank: -1, value: [], name: 'Incomplete' };
        const combos = combinations(all, 5);
        let best = null;
        for (const combo of combos) {
            const ev = evaluateHand5(combo);
            if (!best || compareHandValues(ev, best) > 0) best = ev;
        }
        return best;
    }

    function combinations(arr, k) {
        const result = [];
        function bt(start, current) {
            if (current.length === k) { result.push([...current]); return; }
            for (let i = start; i < arr.length; i++) {
                current.push(arr[i]);
                bt(i + 1, current);
                current.pop();
            }
        }
        bt(0, []);
        return result;
    }

    function evaluateHand5(cards) {
        const ranks = cards.map(c => cardRank(c)).sort((a, b) => b - a);
        const suits = cards.map(c => cardSuit(c));
        const isFlush = suits.every(s => s === suits[0]);

        // Check straight
        let isStraight = false;
        let straightHigh = -1;

        // Normal straight check
        if (ranks[0] - ranks[4] === 4 && new Set(ranks).size === 5) {
            isStraight = true;
            straightHigh = ranks[0];
        }
        // Ace-low straight (wheel): A-2-3-4-5
        if (!isStraight && ranks[0] === 12 && ranks[1] === 3 && ranks[2] === 2 && ranks[3] === 1 && ranks[4] === 0) {
            isStraight = true;
            straightHigh = 3; // 5-high
        }

        // Count ranks
        const counts = {};
        for (const r of ranks) counts[r] = (counts[r] || 0) + 1;
        const groups = Object.entries(counts).map(([r, c]) => ({ rank: +r, count: c }));
        groups.sort((a, b) => b.count - a.count || b.rank - a.rank);

        if (isStraight && isFlush) {
            if (straightHigh === 12) return { rank: 8, value: [8, 12], name: 'Royal Flush' };
            return { rank: 8, value: [8, straightHigh], name: 'Straight Flush' };
        }

        if (groups[0].count === 4) {
            const kicker = groups[1].rank;
            return { rank: 7, value: [7, groups[0].rank, kicker], name: 'Four of a Kind' };
        }

        if (groups[0].count === 3 && groups[1].count === 2) {
            return { rank: 6, value: [6, groups[0].rank, groups[1].rank], name: 'Full House' };
        }

        if (isFlush) {
            return { rank: 5, value: [5, ...ranks], name: 'Flush' };
        }

        if (isStraight) {
            return { rank: 4, value: [4, straightHigh], name: 'Straight' };
        }

        if (groups[0].count === 3) {
            const kickers = groups.filter(g => g.count === 1).map(g => g.rank).sort((a, b) => b - a);
            return { rank: 3, value: [3, groups[0].rank, ...kickers], name: 'Three of a Kind' };
        }

        if (groups[0].count === 2 && groups[1].count === 2) {
            const pairs = [groups[0].rank, groups[1].rank].sort((a, b) => b - a);
            const kicker = groups[2].rank;
            return { rank: 2, value: [2, ...pairs, kicker], name: 'Two Pair' };
        }

        if (groups[0].count === 2) {
            const kickers = groups.filter(g => g.count === 1).map(g => g.rank).sort((a, b) => b - a);
            return { rank: 1, value: [1, groups[0].rank, ...kickers], name: 'One Pair' };
        }

        return { rank: 0, value: [0, ...ranks], name: 'High Card' };
    }

    function compareHandValues(a, b) {
        for (let i = 0; i < Math.max(a.value.length, b.value.length); i++) {
            const av = a.value[i] ?? -1, bv = b.value[i] ?? -1;
            if (av > bv) return 1;
            if (av < bv) return -1;
        }
        return 0;
    }

    /* ══════════════════════════════════════════════════════════════
       GAME ENGINE (runs on host only)
       ══════════════════════════════════════════════════════════════ */
    const PHASE = { WAITING: 0, PREFLOP: 1, FLOP: 2, TURN: 3, RIVER: 4, SHOWDOWN: 5 };

    class PokerGame {
        constructor(config) {
            this.buyIn = config.buyIn;
            this.smallBlind = config.smallBlind;
            this.bigBlind = config.bigBlind;
            // How long a seat may sit on its decision before the table acts for it.
            // Without a clock, one unattended-but-connected tab freezes every other
            // player at the table with no way out but reloading the host.
            this.turnTimeoutMs = config.turnTimeoutMs != null ? config.turnTimeoutMs : 45000;
            // Pace of the automatic run-out when nobody has a decision left.
            this.runOutStepMs = config.runOutStepMs != null ? config.runOutStepMs : 500;
            // { id, name, chips, holeCards, folded, allIn, currentBet, disconnected,
            //   seatIndex, totalBetThisHand, busted, leaving, removed }
            // `leaving` is reversible (a reconnect window that expired); `removed` is
            // not (the host removed them, or they left on purpose).
            this.players = [];
            this.dealerIndex = -1;
            this.phase = PHASE.WAITING;
            this.communityCards = [];
            this.deck = [];
            this.pot = 0;
            this.pots = []; // { amount, eligible: [playerIds] }
            this.currentBet = 0;
            this.currentPlayerIndex = -1;
            this.lastRaiserIndex = -1;
            this.minRaise = 0;
            this.handNum = 0;
            this.onStateChange = null;
            this.onGameOver = null;
            this.onPlayersBusted = null;
            this.roundActed = new Set();
            this.handResults = null;

            // Identity for the turn: bumped every time currentPlayerIndex is assigned
            // (including to -1). An action carries the pair it was drawn for, so a
            // second tap — or a tap replayed out of a reconnect queue — cannot be
            // applied to a decision the player never saw.
            this.turnSeq = 0;
            // The hand ended without a showdown, so nobody's cards may be revealed.
            // PHASE.SHOWDOWN alone means three different things; this splits "a
            // showdown was reached" off from "the hand is over".
            this.uncontested = false;
            // Terminal: a finished table never deals again.
            this.ended = false;
            // Absolute deadline of the current turn (host clock). Shipped to clients as
            // a REMAINING duration, because the two clocks are never the same clock.
            this.turnDeadline = null;

            // Every timer this class arms lives in a field and is cleared before it is
            // replaced. Three fire-and-forget setTimeouts used to drive the phase
            // machine with no way to cancel them, which is the whole of the
            // double-payout bug: one ordinary tap forked the chain in two.
            this._runOutTimer = null;
            this._nextHandTimer = null;
            this._turnClock = null;
        }

        /* ── Timers ────────────────────────────────────────────────── */

        _clearRunOut() {
            if (this._runOutTimer) { clearTimeout(this._runOutTimer); this._runOutTimer = null; }
        }

        _clearNextHand() {
            if (this._nextHandTimer) { clearTimeout(this._nextHandTimer); this._nextHandTimer = null; }
        }

        _clearTurnClock() {
            if (this._turnClock) { clearTimeout(this._turnClock); this._turnClock = null; }
            this.turnDeadline = null;
        }

        _clearAllTimers() {
            this._clearRunOut();
            this._clearNextHand();
            this._clearTurnClock();
        }

        /**
         * Stop for good: the app calls this when the host leaves, so nothing this
         * object armed can fire into a torn-down page.
         */
        destroy() {
            this.ended = true;
            this._clearAllTimers();
            this.onStateChange = null;
            this.onGameOver = null;
            this.onPlayersBusted = null;
        }

        /* ── Roster ────────────────────────────────────────────────── */

        addPlayer(id, name) {
            if (this.players.find(p => p.id === id)) return false;
            // The table is eight SEATS. Busted players keep their row so their own
            // panel keeps updating (they are spectators, not players), so counting the
            // raw array length would shrink the table every time somebody went broke.
            if (this.players.filter(p => !p.busted && !p.leaving).length >= 8) return false;
            // ...but the array itself still has to be bounded.
            if (this.players.length >= 12) return false;
            this.players.push({
                id, name, chips: this.buyIn, holeCards: [],
                folded: false, allIn: false, currentBet: 0,
                disconnected: false, seatIndex: this.players.length,
                totalBetThisHand: 0, busted: false, leaving: false, removed: false
            });
            return true;
        }

        /**
         * A deliberate departure. The seat is NOT spliced out here: the array index is
         * the identity of the dealer, the turn and every entry in roundActed, and
         * _calculateSidePots pays out by walking this.players — so removing a
         * contributor mid-hand loses their chips out of the pots. Mark them, fold them
         * out of the live hand, and let startHand do the physical removal between hands.
         */
        removePlayer(id, permanent = true) {
            const player = this.players.find(p => p.id === id);
            if (!player) return false;
            player.leaving = true;
            player.disconnected = true;
            // DELIBERATE, and therefore not reversible. `leaving` alone means two
            // different things — "their reconnect window expired, they may still come
            // back" (setLeaving) and "they left, or the host removed them" — and
            // setPresent clears it. Without this second flag a seat the host removed
            // was un-removed by its own player's next reconnect.
            //
            // `permanent: false` is for releasing a seat nobody decided against — a
            // player who dropped in the waiting room and whose window ran out. They
            // may walk back in and take a seat again; a removed player may not.
            if (permanent) player.removed = true;

            const idx = this.players.indexOf(player);
            const handLive = this.phase !== PHASE.WAITING && this.phase !== PHASE.SHOWDOWN;
            if (handLive && !player.folded) {
                if (idx === this.currentPlayerIndex) {
                    // Their turn: fold through the normal path so the turn moves on.
                    this.handleAction(player.id, 'fold');
                } else {
                    player.folded = true;
                    if (this.playersInHand().length === 1) this._awardPotToLastPlayer();
                    else if (this._isBettingRoundDone()) this._endBettingRound();
                    else this._broadcast();
                }
            } else if (this.phase === PHASE.WAITING) {
                // Between hands there is no index to disturb: they can go now.
                this._evictLeavers();
            }
            return true;
        }

        /** Gone for good (their reconnect window expired). Dealt out from the next hand. */
        setLeaving(id) {
            const p = this.players.find(x => x.id === id);
            if (!p) return false;
            p.leaving = true;
            p.disconnected = true;
            return true;
        }

        setDisconnected(id, disc) {
            const p = this.players.find(p => p.id === id);
            if (p) p.disconnected = disc;
        }

        /**
         * They are back: present, and no longer on their way out of the table. A seat
         * that was REMOVED on purpose stays removed — only a window that merely expired
         * is reversible.
         */
        setPresent(id) {
            const p = this.players.find(x => x.id === id);
            if (!p) return false;
            if (p.removed) return false;
            p.disconnected = false;
            p.leaving = false;
            return true;
        }

        /**
         * Physically remove the seats that asked to leave. Only ever called between
         * hands. dealerIndex is remapped BY IDENTITY, because the array shifts under
         * it — the old code compacted the array and left the button pointing at
         * whoever happened to slide into that slot.
         */
        _evictLeavers() {
            const leaving = this.players.filter(p => p.leaving);
            if (!leaving.length) return [];

            const removedIds = leaving.map(p => p.id);
            const kept = this.players.filter(p => !p.leaving);
            let newDealer = -1;
            if (this.dealerIndex >= 0 && this.players.length) {
                const dealer = this.players[this.dealerIndex];
                newDealer = kept.indexOf(dealer);
                if (newDealer === -1) {
                    // The dealer themselves left: walk back to the nearest survivor so
                    // _advanceDealer still hands the button to the seat after them.
                    for (let step = 1; step <= this.players.length && newDealer === -1; step++) {
                        const cand = this.players[(this.dealerIndex - step + this.players.length) % this.players.length];
                        newDealer = kept.indexOf(cand);
                    }
                }
            }

            this.players = kept;
            this.dealerIndex = kept.length ? Math.min(Math.max(newDealer, -1), kept.length - 1) : -1;
            kept.forEach((p, i) => { p.seatIndex = i; });
            // Never called mid-hand, so there is no turn to preserve.
            this.currentPlayerIndex = -1;
            return removedIds;
        }

        activePlayers() {
            return this.players.filter(p => !p.folded && p.chips >= 0);
        }

        activeNonAllIn() {
            return this.players.filter(p => !p.folded && !p.allIn);
        }

        playersInHand() {
            return this.players.filter(p => !p.folded);
        }

        /** Seats that still have chips and have not left: the ones a game needs two of. */
        livePlayers() {
            return this.players.filter(p => !p.busted && !p.leaving);
        }

        /** The seat holding the most chips, or null if nobody has any. */
        _chipLeader() {
            let best = null;
            for (const p of this.players) {
                if (p.chips <= 0) continue;
                if (!best || p.chips > best.chips) best = p;
            }
            return best;
        }

        /* ── Hand lifecycle ────────────────────────────────────────── */

        startHand() {
            // A new hand supersedes everything the last one left armed.
            this._clearAllTimers();
            if (this.ended) return;

            // Captured BEFORE the eviction below, because the chip leader may be the
            // very player who left: the game-over overlay still has to be able to name
            // somebody rather than reading a bare "Game Over".
            const leaderBeforeEviction = this._chipLeader();

            // Seats that left (or were lost for good) go now — between hands, where
            // removing them cannot shift an index a live hand is using.
            this._evictLeavers();

            // Chips-out players KEEP their seat: they are dealt out of every later
            // hand, but they still receive states addressed to themselves, so their own
            // panel keeps updating and they can watch. Filtering them out of the array
            // is what froze a busted player's screen with no explanation.
            const newlyBusted = [];
            for (const p of this.players) {
                if (p.chips <= 0 && !p.busted) { p.busted = true; newlyBusted.push(p.id); }
            }
            if (newlyBusted.length && this.onPlayersBusted) this.onPlayersBusted(newlyBusted);

            // Game over is decided BEFORE the "not enough players" return: a table that
            // has shrunk to one seat must end the game, not sit on the last showdown
            // overlay for ever.
            if (this.livePlayers().length < 2) {
                this._gameOver(leaderBeforeEviction);
                return;
            }

            this.handNum++;
            this.deck = shuffleDeck(newDeck());
            this.communityCards = [];
            this.pot = 0;
            this.pots = [];
            this.currentBet = 0;
            this.handResults = null;
            this.uncontested = false;

            // Reset player states
            for (const p of this.players) {
                p.holeCards = [];
                p.folded = p.busted;   // busted seats sit the hand out
                p.allIn = false;
                p.currentBet = 0;
                p.totalBetThisHand = 0;
            }

            // Move dealer
            this._advanceDealer();

            // Post blinds
            const sbIndex = this._seatAfter(this.dealerIndex);
            const bbIndex = this._seatAfter(sbIndex);

            // Heads-up: dealer is SB
            const isHeadsUp = this.players.filter(p => !p.folded).length === 2;
            const sbPlayer = isHeadsUp ? this.players[this.dealerIndex] : this.players[sbIndex];
            const bbPlayer = isHeadsUp ? this.players[sbIndex] : this.players[bbIndex];

            this._postBlind(sbPlayer, this.smallBlind);
            this._postBlind(bbPlayer, this.bigBlind);
            this.currentBet = this.bigBlind;
            this.minRaise = this.bigBlind;

            // Deal hole cards
            for (const p of this.players) {
                if (!p.folded) {
                    p.holeCards = [this.deck.pop(), this.deck.pop()];
                }
            }

            // Start preflop
            this.phase = PHASE.PREFLOP;
            this.roundActed = new Set();
            // First to act preflop: player after BB
            const bbIdx = this.players.indexOf(bbPlayer);
            this.currentPlayerIndex = this._seatAfter(bbIdx);
            this.turnSeq++;
            this.lastRaiserIndex = bbIdx; // BB is the "last raiser" initially

            const first = this.players[this.currentPlayerIndex];
            if (!first || first.folded || first.allIn) {
                // The blinds put everyone all in: nobody has a decision to make, so go
                // straight to the run-out rather than parking the turn on a seat that
                // can never act.
                this._advanceTurn();
                return;
            }

            this._armTurnClock();
            this._broadcast();
            this._checkAutoActions();
        }

        _postBlind(player, amount) {
            const actual = Math.min(amount, player.chips);
            player.chips -= actual;
            player.currentBet = actual;
            player.totalBetThisHand += actual;
            this.pot += actual;
            if (player.chips === 0) player.allIn = true;
        }

        /** The button skips busted and departing seats — they are not in the game. */
        _advanceDealer() {
            const n = this.players.length;
            if (!n) { this.dealerIndex = -1; return; }
            let next = this.dealerIndex;
            for (let i = 0; i < n; i++) {
                next = (next + 1 + n) % n;
                const p = this.players[next];
                if (!p.busted && !p.leaving) { this.dealerIndex = next; return; }
            }
            this.dealerIndex = 0;
        }

        _seatAfter(index) {
            const n = this.players.length;
            if (!n) return -1;
            let next = (index + 1 + n) % n;
            let attempts = 0;
            while (this.players[next].folded && attempts < n) {
                next = (next + 1) % n;
                attempts++;
            }
            return next;
        }

        _seatAfterIncludeAll(index) {
            return (index + 1) % this.players.length;
        }

        /* ── Turn identity and the turn clock ──────────────────────── */

        /**
         * Nobody has a decision to make. turnSeq is bumped along with the index so a
         * token minted for the seat that just acted is refused as firmly as the index
         * is, and the clock is stopped — its expiry would dereference players[-1].
         */
        _setNoTurn() {
            this.currentPlayerIndex = -1;
            this.turnSeq++;
            this._clearTurnClock();
        }

        /**
         * Start the clock on the seat that is now to act. Captures the turn it was
         * armed for, so a clock that survives a synchronous re-entry (or a hand that
         * ended in between) cannot act on somebody else's decision.
         */
        _armTurnClock() {
            this._clearTurnClock();
            if (this.turnTimeoutMs <= 0) return;
            if (this.currentPlayerIndex < 0) return;
            if (this.phase <= PHASE.WAITING || this.phase >= PHASE.SHOWDOWN) return;
            const seq = this.turnSeq;
            const hand = this.handNum;
            this.turnDeadline = Date.now() + this.turnTimeoutMs;
            this._turnClock = setTimeout(() => {
                this._turnClock = null;
                this.turnDeadline = null;
                if (this.turnSeq !== seq || this.handNum !== hand) return;
                if (this.phase <= PHASE.WAITING || this.phase >= PHASE.SHOWDOWN) return;
                if (this.currentPlayerIndex < 0) return;
                this._autoActFor(this.players[this.currentPlayerIndex]);
            }, this.turnTimeoutMs);
        }

        /** Check if they can, fold if they cannot. Shared by the clock and auto-actions. */
        _autoActFor(player) {
            if (!player) return false;
            return this.handleAction(player.id, player.currentBet >= this.currentBet ? 'check' : 'fold');
        }

        /* ── Actions ───────────────────────────────────────────────── */

        /**
         * @param {object} [meta] — { handNum, turnSeq } the action was drawn for. When
         *   given it must match exactly: a second tap, or one replayed out of a
         *   reconnect queue, belongs to a decision that no longer exists.
         * @returns {boolean} whether the action changed anything.
         */
        handleAction(playerId, action, amount, meta = null) {
            if (this.phase === PHASE.WAITING || this.phase === PHASE.SHOWDOWN) return false;
            // No decision is pending (the board is running itself out).
            if (this.currentPlayerIndex < 0) return false;

            const pIdx = this.players.findIndex(p => p.id === playerId);
            if (pIdx === -1 || pIdx !== this.currentPlayerIndex) return false;

            if (meta && (meta.handNum !== this.handNum || meta.turnSeq !== this.turnSeq)) return false;

            const player = this.players[pIdx];
            if (player.folded || player.allIn || player.busted) return false;

            if (typeof action !== 'string') return false;
            // Only a raise reads the amount, so its absence is normal everywhere else
            // and is normalised away here. A RAISE with no amount, though, cannot be
            // honoured: clamping it up to the minimum invents a bet the player never
            // chose, and that is exactly what a garbled wire value buys (BinaryPack and
            // JSON both turn a NaN amount into null on the way across).
            if (action !== 'raise') amount = 0;
            // A non-numeric raise amount used to turn chips, the pot and currentBet
            // into NaN for the rest of the game. Chips are whole numbers everywhere
            // else in this engine, so a fractional raise is refused too: accepted, it
            // turned every stack at the table into a float for the rest of the session.
            if (typeof amount !== 'number' || !Number.isInteger(amount) || amount < 0) return false;

            // A "call" with nothing to call is a check. Left as an alias it was the
            // quiet way a doubled Call became an unseen check on the next street.
            if (action === 'call' && this.currentBet - player.currentBet <= 0) action = 'check';

            switch (action) {
                case 'fold':
                    player.folded = true;
                    this.roundActed.add(pIdx);
                    if (this.playersInHand().length === 1) {
                        this._awardPotToLastPlayer();
                        return true;
                    }
                    break;

                case 'check':
                    if (player.currentBet < this.currentBet) return false; // Can't check
                    this.roundActed.add(pIdx);
                    break;

                case 'call': {
                    const toCall = this.currentBet - player.currentBet;
                    const actual = Math.min(toCall, player.chips);
                    player.chips -= actual;
                    player.currentBet += actual;
                    player.totalBetThisHand += actual;
                    this.pot += actual;
                    if (player.chips === 0) player.allIn = true;
                    this.roundActed.add(pIdx);
                    break;
                }

                case 'raise': {
                    const raiseTotal = Math.max(amount, this.currentBet + this.minRaise);
                    const needed = raiseTotal - player.currentBet;
                    const actual = Math.min(needed, player.chips);
                    const actualTotal = player.currentBet + actual;

                    // Calculate the raise increment for future min-raise
                    const raiseIncrement = actualTotal - this.currentBet;
                    if (raiseIncrement >= this.minRaise || actual === player.chips) {
                        // Valid raise or all-in
                        this.minRaise = Math.max(this.minRaise, raiseIncrement);
                    }

                    player.chips -= actual;
                    player.currentBet = actualTotal;
                    player.totalBetThisHand += actual;
                    this.pot += actual;
                    this.currentBet = actualTotal;
                    if (player.chips === 0) player.allIn = true;
                    this.lastRaiserIndex = pIdx;
                    // Everyone else needs to act again
                    this.roundActed = new Set([pIdx]);
                    break;
                }

                case 'allin': {
                    const allInAmount = player.chips;
                    const newTotal = player.currentBet + allInAmount;
                    if (newTotal > this.currentBet) {
                        const raiseIncrement = newTotal - this.currentBet;
                        if (raiseIncrement >= this.minRaise) {
                            this.minRaise = raiseIncrement;
                            this.lastRaiserIndex = pIdx;
                            this.roundActed = new Set([pIdx]);
                        } else {
                            // Short all-in, doesn't reopen action
                            this.roundActed.add(pIdx);
                        }
                        this.currentBet = newTotal;
                    } else {
                        this.roundActed.add(pIdx);
                    }
                    this.pot += allInAmount;
                    player.chips = 0;
                    player.currentBet = newTotal;
                    player.totalBetThisHand += allInAmount;
                    player.allIn = true;
                    break;
                }

                default:
                    // An unrecognised action must NOT fall through to _advanceTurn: that
                    // passed the turn on without the player having acted.
                    return false;
            }

            this._advanceTurn();
            return true;
        }

        _advanceTurn() {
            // Check if all active non-allin players have acted and matched the bet
            if (this._isBettingRoundDone()) {
                this._endBettingRound();
                return;
            }
            if (this._moveToNextPlayer()) this._armTurnClock();
            else this._setNoTurn();
            this._broadcast();
            this._checkAutoActions();
        }

        _isBettingRoundDone() {
            const activePlayers = this.players.filter(p => !p.folded && !p.allIn);
            if (activePlayers.length === 0) return true;

            for (let i = 0; i < this.players.length; i++) {
                const p = this.players[i];
                if (p.folded || p.allIn) continue;
                if (!this.roundActed.has(i)) return false;
                if (p.currentBet < this.currentBet) return false;
            }
            return true;
        }

        /** @returns {boolean} whether a seat that can act was found. */
        _moveToNextPlayer() {
            let next = this.currentPlayerIndex;
            for (let i = 0; i < this.players.length; i++) {
                next = (next + 1 + this.players.length) % this.players.length;
                const p = this.players[next];
                if (!p.folded && !p.allIn) {
                    this.currentPlayerIndex = next;
                    this.turnSeq++;
                    return true;
                }
            }
            return false;
        }

        /**
         * Act for a seat that is gone for GOOD — one whose reconnect window expired or
         * who left the table. A player whose phone merely blinked keeps their seat
         * until the turn clock runs out: auto-folding inside their own reconnect window
         * is how a five-second flicker used to muck a live hand.
         */
        _checkAutoActions() {
            const current = this.players[this.currentPlayerIndex];
            if (!current) return;
            if (current.leaving) this._autoActFor(current);
        }

        _endBettingRound() {
            // Terminal phases end the chain. Without this a stray tick fell straight
            // through the phase chain below into the run-out block and re-armed itself
            // every step, for ever — re-broadcasting a finished hand and, once the
            // table was down to one player, paying the same pot out a second time.
            if (this.phase === PHASE.SHOWDOWN || this.phase === PHASE.WAITING) return;
            this._clearRunOut();
            this._clearTurnClock();

            // Reset current bets
            for (const p of this.players) {
                p.currentBet = 0;
            }
            this.currentBet = 0;
            this.roundActed = new Set();
            this.minRaise = this.bigBlind;

            // Check if only one player remains
            if (this.playersInHand().length === 1) {
                this._awardPotToLastPlayer();
                return;
            }

            // Check if we can skip remaining streets (all but one are all-in)
            const canAct = this.players.filter(p => !p.folded && !p.allIn);
            const skipToShowdown = canAct.length <= 1;

            if (this.phase === PHASE.PREFLOP) {
                this.phase = PHASE.FLOP;
                this.deck.pop(); // burn
                this.communityCards.push(this.deck.pop(), this.deck.pop(), this.deck.pop());
            } else if (this.phase === PHASE.FLOP) {
                this.phase = PHASE.TURN;
                this.deck.pop(); // burn
                this.communityCards.push(this.deck.pop());
            } else if (this.phase === PHASE.TURN) {
                this.phase = PHASE.RIVER;
                this.deck.pop(); // burn
                this.communityCards.push(this.deck.pop());
            } else if (this.phase === PHASE.RIVER) {
                this._showdown();
                return;
            } else {
                // A phase this chain does not own. Stop rather than fall through — and
                // clear the turn on the way out: the clock was stopped above while
                // currentPlayerIndex still names the last actor, and leaving that pair
                // behind is exactly the frozen table this whole fix closes.
                this._setNoTurn();
                return;
            }

            if (skipToShowdown) {
                // The board is dealing itself out and nobody may act. Clearing the turn
                // is what stops a live-looking Check button from forking this chain.
                this._setNoTurn();
                this._broadcast();
                this._runOutTimer = setTimeout(() => {
                    this._runOutTimer = null;
                    this._endBettingRound();
                }, this.runOutStepMs);
                return;
            }

            // Next round: first active player after dealer
            this.currentPlayerIndex = this.dealerIndex;
            if (this._moveToNextPlayer()) this._armTurnClock();
            else this._setNoTurn();
            this.lastRaiserIndex = -1;

            this._broadcast();
            this._checkAutoActions();
        }

        _awardPotToLastPlayer() {
            const winner = this.playersInHand()[0];
            // Unreachable today (every caller checks playersInHand().length === 1), but
            // a bare return here would leave the turn pointing at the last actor with
            // its clock already stopped — a frozen table.
            if (!winner) { this._setNoTurn(); return; }
            const amount = this.pot;
            winner.chips += amount;
            // Zeroed the instant it is paid: the payout is then idempotent whatever a
            // stray timer does.
            this.pot = 0;
            this.handResults = [{
                winners: [winner.id],
                amount,
                handName: null
            }];
            // Won without a showdown: nobody bought the right to see these cards.
            this.uncontested = true;
            this.phase = PHASE.SHOWDOWN;
            this._setNoTurn();
            this._clearRunOut();
            this._broadcast();
            this._clearNextHand();
            this._nextHandTimer = setTimeout(() => {
                this._nextHandTimer = null;
                this.startHand();
            }, 3000);
        }

        _showdown() {
            this.phase = PHASE.SHOWDOWN;
            this.uncontested = false;
            this.handResults = [];
            this._setNoTurn();
            this._clearRunOut();

            // Build side pots
            const pots = this._calculateSidePots();

            for (const pot of pots) {
                const eligible = pot.eligible.map(id => this.players.find(p => p.id === id)).filter(Boolean);
                if (eligible.length === 0) continue;

                // Evaluate hands
                let bestEval = null;
                let winners = [];
                for (const p of eligible) {
                    const ev = evaluateBestHand(p.holeCards, this.communityCards);
                    if (!bestEval || compareHandValues(ev, bestEval) > 0) {
                        bestEval = ev;
                        winners = [p];
                    } else if (compareHandValues(ev, bestEval) === 0) {
                        winners.push(p);
                    }
                }

                const share = Math.floor(pot.amount / winners.length);
                const remainder = pot.amount - share * winners.length;
                winners.forEach((w, i) => {
                    w.chips += share + (i === 0 ? remainder : 0);
                });

                this.handResults.push({
                    winners: winners.map(w => w.id),
                    amount: pot.amount,
                    handName: bestEval.name
                });
            }

            // Paid. The overlay reads handResults[].amount, so nothing needs the pot to
            // stay on the table — and a pot that is still there can be paid twice.
            this.pot = 0;

            this._broadcast();
            this._clearNextHand();
            this._nextHandTimer = setTimeout(() => {
                this._nextHandTimer = null;
                this.startHand();
            }, 5000);
        }

        _calculateSidePots() {
            const inHand = this.players.filter(p => !p.folded);
            if (inHand.length === 0) return [];

            // Get unique bet levels
            const betLevels = [...new Set(inHand.map(p => p.totalBetThisHand))].sort((a, b) => a - b);

            const pots = [];
            let prevLevel = 0;

            for (const level of betLevels) {
                if (level <= prevLevel) continue;
                const increment = level - prevLevel;
                let potAmount = 0;
                const eligible = [];

                for (const p of this.players) {
                    if (p.totalBetThisHand > prevLevel) {
                        const contribution = Math.min(increment, p.totalBetThisHand - prevLevel);
                        potAmount += contribution;
                    }
                    if (!p.folded && p.totalBetThisHand >= level) {
                        eligible.push(p.id);
                    }
                }

                if (potAmount > 0 && eligible.length > 0) {
                    pots.push({ amount: potAmount, eligible });
                }
                prevLevel = level;
            }

            // The levels above only reach as high as the highest LIVE contribution, so
            // anything staked above that is not in any pot yet. Normally there is none
            // (an uncalled bet is only possible from a player who is still in the hand,
            // and the top level hands it straight back to them) — but a seat folded out
            // of turn, because its player left or the host removed them, can leave money
            // behind that nobody can be paid back. It is dead money: put it in the main
            // pot rather than letting it evaporate off the table.
            const covered = pots.reduce((sum, p) => sum + p.amount, 0);
            if (covered < this.pot) {
                if (pots.length) pots[0].amount += this.pot - covered;
                else pots.push({ amount: this.pot, eligible: inHand.map(p => p.id) });
            }

            return pots;
        }

        /**
         * @param {object} [fallbackWinner] — a seat captured before the last eviction,
         *   used when the player holding the chips is the one who left.
         */
        _gameOver(fallbackWinner) {
            // Terminal. Nothing may deal, pay or broadcast after this.
            this.ended = true;
            this._clearAllTimers();
            // The chip LEADER, not "the first seat with chips": the array has already
            // been compacted by _evictLeavers, so the winner may not be in it at all.
            const winner = this._chipLeader() || fallbackWinner || null;
            this.phase = PHASE.WAITING;
            this.currentPlayerIndex = -1;
            this.turnSeq++;
            // Nothing is being revealed any more; leave no flag describing a hand that
            // is over.
            this.uncontested = false;
            this._broadcastGameOver(winner);
        }

        /**
         * @param {string|null} playerId — the seat this snapshot is addressed to, or
         *   null/unknown for a spectator view. myId is null unless the seat really
         *   exists, so the protocol can never carry an unaddressable id.
         */
        getStateForPlayer(playerId) {
            const me = playerId == null ? null : this.players.find(p => p.id === playerId);
            return {
                phase: this.phase,
                handNum: this.handNum,
                turnSeq: this.turnSeq,
                // Remaining, not a deadline: host and client clocks are not synced.
                turnRemainingMs: this.turnDeadline ? Math.max(0, this.turnDeadline - Date.now()) : null,
                ended: this.ended,
                pot: this.pot,
                currentBet: this.currentBet,
                minRaise: this.minRaise,
                // Copies, not the live arrays. A snapshot can sit in SlopNet's per-client
                // queue for the whole reconnect window, and _endBettingRound push()es
                // into communityCards in place — so a queued PREFLOP state used to be
                // delivered carrying the river.
                communityCards: this.communityCards.slice(),
                dealerIndex: this.dealerIndex,
                currentPlayerIndex: this.currentPlayerIndex,
                smallBlind: this.smallBlind,
                bigBlind: this.bigBlind,
                handResults: this.handResults ? this.handResults.slice() : null,
                players: this.players.map(p => ({
                    id: p.id,
                    name: p.name,
                    chips: p.chips,
                    folded: p.folded,
                    allIn: p.allIn,
                    busted: !!p.busted,
                    currentBet: p.currentBet,
                    disconnected: p.disconnected,
                    seatIndex: p.seatIndex,
                    // Your own cards always; everyone else's only at a real showdown.
                    // A pot won because everybody folded was never bought, so those
                    // cards stay face down — otherwise you could never bluff.
                    holeCards: (p.id === playerId || (this.phase === PHASE.SHOWDOWN && !this.uncontested && !p.folded))
                        ? p.holeCards.slice()
                        : (p.holeCards.length > 0 && !p.folded ? ['back', 'back'] : []),
                    totalBetThisHand: p.totalBetThisHand
                })),
                myId: me ? playerId : null
            };
        }

        _broadcast() {
            if (this.onStateChange) this.onStateChange();
        }

        _broadcastGameOver(winner) {
            if (this.onGameOver) this.onGameOver(winner);
        }
    }

    /* ══════════════════════════════════════════════════════════════
       NETWORKING (SlopNet)
       ══════════════════════════════════════════════════════════════ */
    const STORAGE_KEY = 'holdem-client-id';
    const ROOM_PREFIX = 'slop-holdem-';
    // SlopLobby remembers the code a host tab is using under this key so a browser that
    // discards and restores the tab comes back as the SAME room. A deliberate close has
    // to forget it — see the beforeunload handler.
    const ROOM_CODE_KEY = STORAGE_KEY + '-room-code';

    let lobby = null;
    // Create Table and Join Table sit on the same screen and write the same `lobby`
    // global, and each one can be dialling for up to ten seconds. Every entry point
    // takes the next generation before it builds anything; everything that settles
    // late — a rejected promise, a callback, a teardown — compares against it, so a
    // superseded attempt can never repaint, and never destroy, the table that is
    // actually running.
    let tableGen = 0;
    let isHost = false;
    let myPlayerId = null;
    let myName = '';
    let game = null;
    let roomCode = '';
    // Host: remembered so a player who comes back after the last hand is told the game
    // is over instead of being dropped into an empty waiting room.
    let lastWinner = null;
    // One teardown at a time (Leave can be tapped twice).
    let leavingTable = false;
    // Host: playerId -> seat code. The ONLY proof a fresh tab (new sessionStorage, so a
    // new clientId and no seat token) can offer that a seat is theirs. A name is not
    // proof: every name at the table is broadcast to every client.
    const seatCodes = new Map();

    /**
     * Retire whatever this tab is currently running and become its owner.
     * Called first thing by hostGame() and joinGame(), synchronously, before either
     * of them awaits anything — so a caller can read `tableGen` straight after the
     * call to learn which generation its own attempt took.
     * @returns {number} the generation this attempt owns.
     */
    function takeOverTable() {
        tableGen++;
        // The lobby first: once it is gone nothing else can call back into the game.
        if (lobby) { const old = lobby; lobby = null; try { old.destroy(); } catch (e) { /* already gone */ } }
        if (game) { const old = game; game = null; try { old.destroy(); } catch (e) { /* already gone */ } }
        return tableGen;
    }

    const SEAT_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    function newSeatCode() {
        let code = '';
        for (let i = 0; i < 4; i++) {
            code += SEAT_CODE_CHARS[Math.floor(Math.random() * SEAT_CODE_CHARS.length)];
        }
        return code;
    }

    /**
     * Host: the seat a reclaim code names, or null. Codes are compared upper-cased.
     * Self-pruning: a code whose seat has left the table names nothing and must not
     * outlive it — this is the only place the map is read, so it is the one place that
     * can keep it honest without a sweep somewhere else.
     */
    function seatForCode(code) {
        if (!code || !game) return null;
        let hit = null;
        for (const [playerId, seatCode] of seatCodes) {
            const seat = game.players.find(p => p.id === playerId);
            if (!seat) { seatCodes.delete(playerId); continue; }
            if (seatCode === code && !hit) hit = seat;
        }
        return hit;
    }

    function normaliseCode(value) {
        return String(value == null ? '' : value).trim().toUpperCase().slice(0, 4);
    }

    // Client state
    let lastGameState = null;
    // Client: the seat code the host issued us, shown in the menu so a player who has to
    // move to another device can read it out (the host can read it too).
    let mySeatCode = '';
    // Terminal verdict from the library ('rejected' | 'superseded' | 'room-closed').
    // It survives resetToLobby so the bookends that follow it cannot overwrite the
    // reason the player was actually given; the next join clears it.
    let terminalState = null;
    // Client: how many reconnect rungs this outage has actually reported. The library
    // CLAMPS the attempt number it hands us at the ladder size on purpose (so a UI is
    // never asked to render "attempt 27 of 20"), and the ladder is walked more than
    // once — so throttling on that number toasts on every rung of the second pass.
    let reconnectRungs = 0;
    let leaveAckResolve = null;
    // Host seat only: a second guard behind the turn token, because the host's own tap
    // is applied synchronously and its state is redrawn before a finger can lift.
    let lastLocalActionAt = 0;
    // Host: whether the room is currently registered with the signalling server. New
    // players cannot dial the code while this is false; the game itself is unaffected.
    let hostSignallingOk = true;

    /* ── HOST ── */
    async function hostGame(name, config) {
        const gen = takeOverTable();
        isHost = true;
        myPlayerId = 'host';
        myName = name;

        game = new PokerGame(config);
        game.addPlayer(myPlayerId, name);
        seatCodes.clear();

        game.onStateChange = () => {
            broadcastState();
            renderGame(game.getStateForPlayer(myPlayerId));
        };

        game.onGameOver = (winner) => {
            lastWinner = winner ? { name: winner.name, chips: winner.chips } : null;
            lobby.broadcast({ type: 'gameOver', winner: lastWinner });
            showGameOver(lastWinner);
        };

        // One-shot notice only. The client's source of truth for "I am out" is
        // `me.busted` in the state it renders from, so a lost message costs nothing.
        game.onPlayersBusted = (ids) => {
            for (const [clientId, entry] of lobby.players) {
                if (entry && entry.playerId && ids.indexOf(entry.playerId) !== -1) {
                    lobby.send(clientId, { type: 'bustedOut' });
                }
            }
            if (ids.indexOf(myPlayerId) !== -1) toast('You are out of chips — spectating');
        };

        lobby = new SlopLobby.SlopLobby({
            roomPrefix: ROOM_PREFIX,
            storageKey: STORAGE_KEY,

            // The room code SlopNet reports is authoritative: if a signalling reconnect
            // ever renames the room, what is painted here — and what clients were told —
            // has to follow, or the code on screen dials nothing.
            onRoomCode: (code, changed) => {
                roomCode = code;
                $('#display-code').textContent = code;
                if (changed) {
                    toast('Room code changed to ' + code);
                    broadcastWaitingRoom();
                }
            },

            // The HOST's own signalling socket. Nobody is evicted by any of this (the
            // data channels are untouched), but a host whose registration has died sees
            // a perfectly normal table while the code on screen dials nothing.
            onStateChange: (status) => {
                if (status === 'reconnect-failed') {
                    hostSignallingOk = false;
                    toast('New players cannot join right now');
                } else if (status === 'reconnected') {
                    // Only announce the recovery if the failure was announced. A blip
                    // that the ladder mends in a second never reaches 'reconnect-failed',
                    // so an unconditional toast tells the host a problem they were never
                    // told about is over.
                    if (!hostSignallingOk) toast('Table is reachable again');
                    hostSignallingOk = true;
                }
                updateWaitingRoom();
            },

            onHostData: (clientId, data) => {
                if (!game || !data || typeof data !== 'object') return;
                // Every message is answered on behalf of the SEAT this connection holds,
                // never on behalf of an id in the payload.
                const entry = lobby.players.get(clientId);
                if (!entry || !entry.playerId) return;
                if (!game.players.some(p => p.id === entry.playerId)) return;

                if (data.type === 'action') {
                    // The token the action was drawn for. Without both halves a second
                    // tap — or one replayed out of a reconnect queue — lands on a
                    // decision the player never saw. Number.isInteger, not typeof: NaN
                    // is a 'number' and would sail through a typeof gate (it is caught
                    // downstream by the token compare, but a gate that lets a value
                    // through and relies on the next one is not a gate).
                    const ok = Number.isInteger(data.handNum) && Number.isInteger(data.turnSeq) &&
                        game.handleAction(
                            // The amount is passed through exactly as it arrived, so
                            // handleAction refuses garbage rather than this line
                            // quietly turning "raise NaN" into "raise the minimum".
                            entry.playerId, data.action, data.amount,
                            { handNum: data.handNum, turnSeq: data.turnSeq }
                        );
                    if (!ok) {
                        // Nothing changed, so no broadcast is coming: give this client
                        // its state back or its buttons stay on 'Sending…' for ever.
                        sendSeatState(clientId, entry.playerId);
                    }
                } else if (data.type === 'resync-request') {
                    sendSeatState(clientId, entry.playerId);
                } else if (data.type === 'leave') {
                    lobby.send(clientId, { type: 'leave-ok' });
                    game.removePlayer(entry.playerId);
                    seatCodes.delete(entry.playerId);
                    lobby.removeClient(clientId);
                    toast((entry.name || 'A player') + ' left the table');
                    updateWaitingRoom();
                    broadcastWaitingRoom();
                    hostRefresh();
                }
            },

            onPlayerJoined: (clientId, metadata) => {
                const playerName = String((metadata && metadata.name) || 'Player').slice(0, 12).trim() || 'Player';
                const code = normaliseCode(metadata && metadata.reclaim);
                if (game.ended) return 'Game over';

                // A PROVEN seat reclaim is answered before the no-latecomers gate: this
                // is the player whose tab died mid-hand coming back on a new device, and
                // refusing them would leave their chips at the table auto-folding every
                // orbit until they bust. The proof is the seat code, never the name —
                // names are broadcast to everyone, so a name-only claim let any stranger
                // take an away player's seat.
                if (code) {
                    const claimed = seatForCode(code);
                    // `leaving` is NOT a bar here: a seat marked leaving because its
                    // reconnect window expired is precisely the one its owner is trying
                    // to reclaim, and setPresent puts them back in the game. Only a
                    // deliberate removal (`removed`) is final.
                    if (claimed && !claimed.removed && claimed.id !== myPlayerId &&
                        reclaimSeat(clientId, claimed, playerName)) {
                        return;
                    }
                    // A code that names nothing here is not a refusal: this device may
                    // simply be remembering a seat from an EARLIER game in a room that
                    // has since been re-created under the same code. Fall through and be
                    // treated as the ordinary new joiner they are.
                }

                // `|| undefined`: SlopLobby reads a STRING return as a refusal, so the
                // success value must not be null.
                return admitPlayer(clientId, playerName) || undefined;
            },

            onPlayerRejoined: (clientId, metadata) => {
                const entry = lobby.players.get(clientId);
                let seat = entry && entry.playerId
                    ? game.players.find(p => p.id === entry.playerId)
                    : null;

                if (!seat) {
                    // The record names no seat. Either it was rebuilt from wire metadata
