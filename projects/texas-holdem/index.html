                    // (SlopLobby's parked record was dropped at its cap) or the seat is
                    // gone. A reclaim code in the metadata is still proof, so try that
                    // before turning a legitimate returner away for good.
                    const code = normaliseCode(metadata && metadata.reclaim);
                    const claimed = code ? seatForCode(code) : null;
                    if (claimed && !claimed.removed && claimed.id !== myPlayerId) {
                        const name = String((metadata && metadata.name) || claimed.name).slice(0, 12).trim();
                        if (reclaimSeat(clientId, claimed, name)) return;
                    }
                    if (!game.ended && game.phase === PHASE.WAITING) {
                        // Their seat was released while they were away — they dropped in
                        // the waiting room and their window ran out — and nothing has
                        // been dealt. Seat them again: before the first hand a returner
                        // and a newcomer are the same thing, and refusing somebody their
                        // own name at a table that is still filling up is exactly the
                        // "never turn a returning human away" case.
                        const back = String((metadata && metadata.name) || (entry && entry.name) || 'Player')
                            .slice(0, 12).trim() || 'Player';
                        const refusal = admitPlayer(clientId, back);
                        if (!refusal) return;
                        lobby.removeClient(clientId, refusal);
                        updateWaitingRoom();
                        broadcastWaitingRoom();
                        return;
                    }
                    // A record with no seat speaks for nobody: refuse it rather than
                    // greeting a stranger and sending them somebody's cards.
                    lobby.removeClient(clientId, 'That seat is no longer at this table');
                    updateWaitingRoom();
                    broadcastWaitingRoom();
                    return;
                }

                if (seat.removed) {
                    // The host removed this seat while its player was off the air. That
                    // decision is not undone by the player's own reconnect.
                    lobby.removeClient(clientId, 'Removed by the host');
                    updateWaitingRoom();
                    broadcastWaitingRoom();
                    return;
                }

                // A rejoin for a seat that was never marked away is a no-op — a duplicate
                // join on a channel the host is already bound to. Answer that client and
                // stop: a toast and two full-table broadcasts per inbound message is an
                // amplifier anybody can pull on.
                const wasAway = seat.disconnected || seat.leaving;
                game.setPresent(seat.id);
                if (!wasAway) {
                    // Answer this client and nobody else — but ANSWER it. A rejoin the
                    // host never saw as away is routinely a tab that has never been told
                    // anything: a duplicate tab, or a reload that beat the host's notice
                    // of the old channel closing. Without 'joined' it holds no seat id,
                    // and in the waiting room a bare snapshot cannot move it off the join
                    // form at all, so it sits on a dead 'Connecting...' button while the
                    // host shows it as present.
                    lobby.send(clientId, {
                        type: 'joined', playerId: seat.id,
                        reclaimCode: seatCodes.get(seat.id) || null,
                        waiting: game.phase === PHASE.WAITING && !game.ended
                    });
                    sendSeatState(clientId, seat.id);
                    return;
                }

                toast((entry.name || seat.name) + ' reconnected');
                if (game.ended) {
                    lobby.send(clientId, { type: 'gameOver', winner: lastWinner });
                } else if (game.phase !== PHASE.WAITING) {
                    // The whole table hears it too — everyone's screen still shows them
                    // as away — and this client's own snapshot rides along.
                    hostRefresh();
                } else {
                    lobby.send(clientId, {
                        type: 'joined', playerId: seat.id,
                        reclaimCode: seatCodes.get(seat.id) || null, waiting: true
                    });
                }
                updateWaitingRoom();
                broadcastWaitingRoom();
            },

            onPlayerLeft: (clientId, meta, final) => {
                // TEMPORARY only: sloplobby calls onPlayerLost for the final one. The seat
                // is being held, so mark it away and leave the decision to the turn clock
                // — auto-folding here mucks the hand of a player whose phone blinked for
                // five seconds and who is already on their way back.
                if (final) return;
                if (!meta || !meta.playerId) return;
                if (!game.players.some(p => p.id === meta.playerId)) return;
                game.setDisconnected(meta.playerId, true);
                toast((meta.name || 'A player') + ' disconnected');
                updateWaitingRoom();
                broadcastWaitingRoom();
                if (game.phase !== PHASE.WAITING) hostRefresh();
            },

            onPlayerLost: (clientId, meta) => {
                // FINAL: the reconnect window expired. Their record is parked by the
                // library for a late return, so nothing here deletes it.
                if (!meta || !meta.playerId) return;
                const pIdx = game.players.findIndex(p => p.id === meta.playerId);
                if (pIdx === -1) return;
                // Marked leaving so they stop paying blinds into a hand nobody is
                // playing, and are dealt out from the next one.
                game.setLeaving(meta.playerId);
                if (game.phase === PHASE.WAITING) {
                    // Nobody decided against them — the link simply never came back —
                    // so the seat is released WITHOUT the permanent bar a host's Remove
                    // carries. They may take a seat again if they turn up.
                    game.removePlayer(meta.playerId, false);
                } else {
                    if (pIdx === game.currentPlayerIndex) game._checkAutoActions();
                    hostRefresh();
                }
                updateWaitingRoom();
                broadcastWaitingRoom();
            },
        });

        // Into a local first: taken over while the room was registering (the player
        // gave up and tapped Join), the lobby built above has already been destroyed
        // and this code names nothing — writing it to the global would replace the
        // code the join that now owns this tab is dialling.
        const code = await lobby.createRoom(name);
        if (gen !== tableGen) return;
        roomCode = code;

        showScreen('waiting-room');
        $('#display-code').textContent = roomCode;
        updateWaitingRoom();
    }

    /** Re-broadcast the table (and repaint the host's own screen). */
    function hostRefresh() {
        if (game && game.onStateChange) game.onStateChange();
        // The host menu names the seat its buttons act on, so it cannot be left showing
        // a turn that has since moved.
        if (isHost && $('#game-menu').classList.contains('show')) renderGameMenu();
    }

    /**
     * Host: seat a player who has no seat here yet. Shared by the join callback and by
     * a returner whose seat was already released, so the two cannot drift apart — the
     * name check, the seat code and the 'joined' reply are written once.
     * @returns {string|null} a rejection reason, or null once they are seated.
     */
    function admitPlayer(clientId, playerName) {
        if (!lobby || !game) return 'The table is gone';
        if (game.ended) return 'Game over';
        if (game.phase !== PHASE.WAITING) return 'Game already in progress';
        // One name, one seat. A returning player proves themselves with their seat code
        // or with the library's own seat token (a reload of the same tab, which never
        // reaches this path at all) — never with a name, which everyone can read.
        if (game.players.some(p => p.name.toLowerCase() === playerName.toLowerCase())) {
            return 'That name is already at this table';
        }
        const playerId = 'p' + Date.now() + Math.random().toString(36).slice(2, 5);
        if (!game.addPlayer(playerId, playerName)) return 'Table is full';
        // The record is the only clientId -> seat map there is.
        lobby.players.set(clientId, { name: playerName, playerId });
        seatCodes.set(playerId, newSeatCode());
        toast(playerName + ' joined');
        // `waiting` is the HOST's answer to "which screen is this?". A client cannot
        // work it out from its own: a player re-seated by a host tab that restarted
        // under the same room code is still showing the board of the game that ended.
        lobby.send(clientId, {
            type: 'joined', playerId, reclaimCode: seatCodes.get(playerId), waiting: true
        });
        updateWaitingRoom();
        broadcastWaitingRoom();
        return null;
    }

    /** Host: this client's own snapshot, and nothing else. */
    function sendSeatState(clientId, playerId) {
        if (!lobby || !game) return;
        lobby.send(clientId, { type: 'state', state: game.getStateForPlayer(playerId) });
        if (game.ended) lobby.send(clientId, { type: 'gameOver', winner: lastWinner });
    }

    /**
     * Host: hand a seat to a connection that PROVED it owns it (a matching seat code).
     * Any other record pointing at the same seat is retired first — two clientIds mapped
     * to one seat would both be sent that seat's hole cards.
     * @returns {boolean} whether the seat was handed over.
     */
    function reclaimSeat(clientId, seat, playerName) {
        if (!lobby || !game || !seat) return false;
        for (const [cid, e] of [...lobby.players, ...(lobby._pastPlayers || [])]) {
            if (cid !== clientId && e && e.playerId === seat.id) {
                lobby.removeClient(cid, 'Your seat was reclaimed on another device');
            }
        }
        lobby.players.set(clientId, { name: seat.name, playerId: seat.id });
        game.setPresent(seat.id);
        toast((playerName || seat.name) + ' rejoined');
        lobby.send(clientId, {
            type: 'joined', playerId: seat.id,
            reclaimCode: seatCodes.get(seat.id) || null,
            waiting: game.phase === PHASE.WAITING && !game.ended
        });
        if (game.ended) {
            lobby.send(clientId, { type: 'gameOver', winner: lastWinner });
        } else if (game.phase !== PHASE.WAITING) {
            // Everyone's screen still shows this seat as away; the returning client's own
            // snapshot rides along with the broadcast.
            hostRefresh();
        }
        updateWaitingRoom();
        broadcastWaitingRoom();
        return true;
    }

    function broadcastState() {
        if (!lobby || !game) return;
        for (const [clientId, entry] of lobby.players) {
            if (!entry || !entry.playerId) continue;
            lobby.send(clientId, { type: 'state', state: game.getStateForPlayer(entry.playerId) });
        }
    }

    function broadcastWaitingRoom() {
        if (!lobby || !game) return;
        const players = game.players.map(p => ({
            name: p.name, id: p.id, disconnected: p.disconnected, busted: !!p.busted
        }));
        lobby.broadcast({ type: 'waitingRoom', players, roomCode });
    }

    /** Host: remove a seat for good, from the game menu. */
    function removeSeat(playerId) {
        if (!isHost || !game || !lobby) return;
        const seat = game.players.find(p => p.id === playerId);
        if (!seat || seat.id === myPlayerId) return;
        const name = seat.name;
        // Both maps. `lobby.players` holds only the clients SlopLobby currently seats;
        // once a reconnect window expires the record is PARKED in _pastPlayers — and a
        // ghost whose window expired is exactly the seat a host taps Remove on. Sweeping
        // only the live map meant the kick never reached the library at all: no
        // rejection was held against that player's retry ladder, and their next
        // reconnect walked them straight back in.
        for (const [clientId, entry] of [...lobby.players, ...(lobby._pastPlayers || [])]) {
            if (entry && entry.playerId === playerId) lobby.removeClient(clientId, 'Removed by the host');
        }
        game.removePlayer(playerId);
        seatCodes.delete(playerId);
        toast(name + ' removed');
        updateWaitingRoom();
        broadcastWaitingRoom();
        hostRefresh();
        renderGameMenu();
    }

    /* ── CLIENT ── */

    /** Client: our own seat code for a room, remembered across tabs on this device. */
    function seatCodeKey(code) { return 'holdem-seat-' + code; }

    function loadSeatCode(code) {
        try { return localStorage.getItem(seatCodeKey(code)) || ''; } catch (e) { return ''; }
    }

    function saveSeatCode(code, seatCode) {
        mySeatCode = seatCode || '';
        try {
            if (seatCode) localStorage.setItem(seatCodeKey(code), seatCode);
        } catch (e) { /* private mode: the code is still on screen in the menu */ }
    }

    /* Everything below the wire is somebody else's browser. A state is rendered — and
       run through the hand evaluator, which is C(n,5) work — so its shape is checked
       once, here, rather than in each of the six places that read it. */
    const CARD_RE = /^(?:[2-9TJQKA][shdc]|back)$/;

    function isCardList(list, max) {
        if (!Array.isArray(list) || list.length > max) return false;
        return list.every(c => typeof c === 'string' && CARD_RE.test(c));
    }

    function isRenderableState(state) {
        if (!state || typeof state !== 'object') return false;
        if (!Array.isArray(state.players) || state.players.length > 12) return false;
        if (!isCardList(state.communityCards, 5)) return false;
        if (state.handResults != null && !Array.isArray(state.handResults)) return false;
        for (const r of (state.handResults || [])) {
            if (!r || !Array.isArray(r.winners)) return false;
        }
        for (const p of state.players) {
            if (!p || typeof p !== 'object') return false;
            if (!isCardList(p.holeCards == null ? [] : p.holeCards, 2)) return false;
        }
        return true;
    }

    async function joinGame(name, code, reclaimCode) {
        const gen = takeOverTable();
        roomCode = code.toUpperCase();
        myName = name;
        isHost = false;
        lastGameState = null;
        terminalState = null;
        reconnectRungs = 0;
        myPlayerId = null;
        // A code typed in by the player beats the one this device remembers: they are
        // reading it off the host's screen precisely because this device has none.
        const reclaim = normaliseCode(reclaimCode) || loadSeatCode(roomCode);
        mySeatCode = reclaim;

        lobby = new SlopLobby.SlopLobby({
            roomPrefix: ROOM_PREFIX,
            storageKey: STORAGE_KEY,

            // Every case here has to tolerate arriving in any order: the library flushes
            // the backlog it queued for us BEFORE the host's rejoin snapshot, so a
            // 'state' can easily land before the 'joined' that names our seat. Nothing
            // below depends on a previous message having arrived.
            onClientData: (data) => {
                if (gen !== tableGen) return;      // this attempt has been taken over
                if (!data || typeof data !== 'object') return;
                if (data.type === 'joined') {
                    myPlayerId = data.playerId || null;
                    if (typeof data.reclaimCode === 'string' && data.reclaimCode) {
                        saveSeatCode(roomCode, normaliseCode(data.reclaimCode));
                    }
                    $('#game-over').classList.remove('show');
                    // The HOST says which screen this is. Deferring to whatever screen
                    // happens to be up cannot tell "re-seated into a brand-new pre-game
                    // table" (a host tab that restarted under the same room code) from
                    // "reclaimed my seat in the hand that is running", and gets the
                    // first one wrong: the board stays up and the empty WAITING snapshot
                    // is painted onto it. `waiting` undefined is a host still running
                    // the older page — fall back to what that page's clients did.
                    const waiting = data.waiting === undefined
                        ? !$('#game').classList.contains('active')
                        : !!data.waiting;
                    if (waiting) {
                        // Nothing of the old game may survive into the new one: a stale
                        // snapshot here is what the next 'gameStart' would repaint.
                        lastGameState = null;
                        stopTurnClock();
                        showScreen('waiting-room');
                        $('#display-code').textContent = roomCode;
                        $('#btn-start-game').style.display = 'none';
                        $('#waiting-status').textContent = 'Waiting for host to start...';
                    }
                } else if (data.type === 'waitingRoom') {
                    renderWaitingPlayers(Array.isArray(data.players) ? data.players : []);
                } else if (data.type === 'state') {
                    // Everything below reads these two arrays without asking again.
                    if (!isRenderableState(data.state)) return;
                    lastGameState = data.state;
                    if (data.state.myId) myPlayerId = data.state.myId;
                    if ($('#game').classList.contains('active') || data.state.phase !== PHASE.WAITING) {
                        showScreen('game');
                        renderGame(data.state);
                    }
                } else if (data.type === 'gameStart') {
                    showScreen('game');
                    if (lastGameState) renderGame(lastGameState);
                } else if (data.type === 'gameOver') {
                    showGameOver(data.winner);
                } else if (data.type === 'bustedOut') {
                    toast('You are out of chips — spectating');
                    if (lastGameState) renderGame(lastGameState);
                } else if (data.type === 'leave-ok') {
                    if (leaveAckResolve) { const r = leaveAckResolve; leaveAckResolve = null; r(); }
                } else if (data.type === 'join-error') {
                    // The same refusal also arrives as onStateChange('rejected'); whichever
                    // gets here first paints it, and the other stays quiet.
                    if (terminalState === 'rejected') return;
                    terminalState = 'rejected';
                    toast(data.reason || 'The host turned you away');
                    resetToLobby();
                }
                // Every refusal now travels as 'join-error' (the library's own contract),
                // so there is no {type:'error'} case: the host never sends one.
            },

            onStateChange: (status, detail) => {
                if (gen !== tableGen) return;      // this attempt has been taken over
                if (status === 'reconnecting') {
                    // Throttled: a toast per rung is noise. Counted here rather than
                    // read off `detail.attempt`, which is clamped at the ladder size —
                    // every rung of the second pass reports the same number, so a
                    // modulo on it fires on all twenty of them.
                    reconnectRungs++;
                    const max = (detail && detail.max) || 20;
                    if (reconnectRungs <= max && (reconnectRungs === 1 || reconnectRungs % 5 === 0)) {
                        toast('Reconnecting… (' + reconnectRungs + ')');
                    }
                } else if (status === 'reconnected') {
                    reconnectRungs = 0;
                    // `fresh`: the host holds nothing for us any more — its tab restarted
                    // and re-registered the same room code. Whatever is on screen belongs
                    // to a game that no longer exists, so drop it rather than let the
                    // next snapshot paint into it. The 'joined' that follows puts us on
                    // the right screen; this is what stops the old board being the thing
                    // we stare at until it does.
                    if (detail && detail.fresh) {
                        lastGameState = null;
                        myPlayerId = null;
                        stopTurnClock();
                        $('#game-over').classList.remove('show');
                        showScreen('waiting-room');
                        $('#display-code').textContent = roomCode;
                        $('#btn-start-game').style.display = 'none';
                        $('#waiting-status').textContent = 'The host restarted the table — waiting for a new game...';
                    }
                    // Ask for a snapshot: our queue has just been flushed at the host and a
                    // restarted host holds nothing for us at all.
                    if (lobby) lobby.sendToHost({ type: 'resync-request' });
                } else if (status === 'rejected') {
                    if (terminalState === 'rejected') return;
                    terminalState = 'rejected';
                    toast((typeof detail === 'string' && detail) ? detail : 'Removed from the table');
                    resetToLobby();
                } else if (status === 'superseded') {
                    terminalState = 'superseded';
                    resetToLobby();
                } else if (status === 'room-closed') {
                    terminalState = 'room-closed';
                    resetToLobby();
                } else if (status === 'reconnect-failed') {
                    // Also the bookend after a terminal state, where the real reason is
                    // already on screen and must not be overwritten by a generic one.
                    if (terminalState) return;
                    resetToLobby();
                }
                // 'disconnected', 'superseded', 'room-closed' and 'reconnect-failed' are
                // deliberately silent: SlopLobby toasts each of them itself on the way
                // through, and a second toast saying the same thing — for room-closed,
                // character for character — is just noise. 'rejected' is not one of
                // them: the library raises no toast of its own for a refusal.
            },
        });

        // The reclaim code rides in the join metadata, so the host can answer a returning
        // player on the very first knock — including one arriving mid-hand, whose seat is
        // sitting at the table being auto-folded every orbit.
        await lobby.joinRoom(roomCode, myName, reclaim ? { reclaim } : undefined);
    }

    function resetToLobby() {
        stopTurnClock();
        mySeatCode = '';
        if (lobby) { try { lobby.destroy(); } catch (e) { /* already gone */ } lobby = null; }
        lastGameState = null;
        myPlayerId = null;
        leaveAckResolve = null;
        $('#game-menu').classList.remove('show');
        $('#game-over').classList.remove('show');
        showScreen('lobby');
        $('#btn-join').disabled = false;
        $('#btn-join').textContent = 'Join Table';
        $('#btn-create').disabled = false;
        $('#btn-create').textContent = 'Create Table';
    }

    /**
     * @param {object} [token] — { handNum, turnSeq } of the state these buttons were
     *   drawn from. Passed by renderActions so a tap always carries the decision it was
     *   aimed at, rather than whatever the table happens to be doing when it lands.
     */
    function sendAction(action, amount, token) {
        if (isHost) {
            // The host's tap goes straight into the engine, so onHostData's turn token
            // never sees it — hand handleAction the same token a remote client sends, so
            // the host's seat is protected by the same mechanism as every other seat.
            // The debounce stays as belt and braces: the host's screen is redrawn
            // synchronously, so a second tap can land on freshly drawn buttons.
            const now = Date.now();
            if (now - lastLocalActionAt < 300) return;
            lastLocalActionAt = now;
            if (!game) return;
            const meta = token || (() => {
                const st = game.getStateForPlayer(myPlayerId);
                return { handNum: st.handNum, turnSeq: st.turnSeq };
            })();
            game.handleAction(myPlayerId, action, amount || 0, meta);
            return;
        }
        if (!lobby || !lastGameState) return;
        const meta = token || { handNum: lastGameState.handNum, turnSeq: lastGameState.turnSeq };
        lobby.sendToHost({
            type: 'action',
            action,
            amount: amount || 0,
            handNum: meta.handNum,
            turnSeq: meta.turnSeq
        });
        // Close the window a second tap goes through: the buttons stay gone until the
        // host's next snapshot redraws them.
        showActionPending();
    }

    function showActionPending() {
        $('#actions').innerHTML = '<span style="color:var(--color-text-muted);font-size:0.85rem;">Sending…</span>';
        $('#raise-controls').style.display = 'none';
        $('#raise-presets').style.display = 'none';
    }

    /** Leave for good: tell the other side first, then reload. */
    async function leaveTable() {
        if (leavingTable) return;
        leavingTable = true;
        $('#game-menu').classList.remove('show');
        stopTurnClock();
        try {
            if (isHost) {
                if (game) game.destroy();
                // Players hear 'room-closed' instead of reconnecting for minutes
                // against a room that no longer exists.
                //
                // 2000ms, not 1000: PeerHost.close() holds the room open for
                // reconnectBackoffBase + 250 = 1250ms whenever a seat is away, so that
                // an absent player's first reconnect rung is answered with the goodbye
                // rather than silence. A 1000ms race reloaded the page 250ms early —
                // before SlopLobby.destroy() (and with it clearRoomCode) had run, so the
                // tab came back still holding the room code and the next table was
                // announced under the code everyone had just been bounced off.
                if (lobby) await withTimeout(lobby.closeRoom('Host left the table'), 2000);
                // And unconditionally, because the beforeunload fallback that exists for
                // exactly this deliberately stands down once leavingTable is set.
                forgetRoomCode();
            } else if (lobby) {
                const ack = new Promise(resolve => { leaveAckResolve = resolve; });
                lobby.sendToHost({ type: 'leave' });
                await withTimeout(ack, 400);
                lobby.destroy();
            }
        } catch (e) { /* leaving anyway */ }
        location.reload();
    }

    function withTimeout(promise, ms) {
        return Promise.race([
            Promise.resolve(promise),
            new Promise(resolve => setTimeout(resolve, ms))
        ]);
    }

    /* ══════════════════════════════════════════════════════════════
       UI RENDERING
       ══════════════════════════════════════════════════════════════ */

    const esc = SlopLobby.esc;

    function updateWaitingRoom() {
        if (!game) return;
        renderWaitingPlayers(game.players.map(p => ({
            name: p.name, id: p.id, disconnected: p.disconnected, busted: !!p.busted
        })));
        const canStart = game.players.filter(p => !p.disconnected && !p.busted).length >= 2;
        $('#btn-start-game').disabled = !canStart || game.handNum > 0 || game.ended;
        if (isHost) {
            $('#btn-start-game').style.display = '';
            $('#waiting-status').textContent = !hostSignallingOk
                ? 'Offline: new players cannot join until the table is reachable again'
                : (canStart ? '' : 'Need at least 2 players to start');
        } else {
            $('#btn-start-game').style.display = 'none';
            $('#waiting-status').textContent = 'Waiting for host to start...';
        }
    }

    function renderWaitingPlayers(players) {
        const container = $('#waiting-player-list');
        container.innerHTML = '<h3>Players (' + players.length + '/8)</h3>';
        for (const p of players) {
            const div = document.createElement('div');
            div.className = 'player-item';
            let badges = '';
            if (p.id === 'host') badges += '<span class="host-badge">Host</span>';
            if (p.busted) badges += '<span class="disconnected-badge">Out</span>';
            if (p.disconnected) badges += '<span class="disconnected-badge">Away</span>';
            // esc: the name is wire metadata from another player's phone.
            div.innerHTML = `<span>${esc(p.name)}</span><div>${badges}</div>`;
            container.appendChild(div);
        }
        // Update start button state
        if (isHost) {
            const canStart = players.filter(p => !p.disconnected && !p.busted).length >= 2;
            $('#btn-start-game').disabled = !canStart || (game ? game.handNum > 0 || game.ended : false);
        }
    }

    /**
     * What to show as "the pot". During the result window the engine has already paid it
     * out (and zeroed it, so a stray timer cannot pay it twice), so the amount that was
     * won is the honest number to paint until the next hand is dealt.
     */
    function potOnScreen(state) {
        if (state.pot > 0) return state.pot;
        if (state.phase === PHASE.SHOWDOWN && Array.isArray(state.handResults)) {
            return state.handResults.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
        }
        return state.pot || 0;
    }

    function renderGame(state) {
        if (!state || !Array.isArray(state.players)) return;
        // The host renders its own snapshot directly, so this is the one place both
        // roles meet: never assume the board is an array.
        const community = Array.isArray(state.communityCards) ? state.communityCards : [];

        // Blinds
        $('#blinds-display').textContent = state.smallBlind + '/' + state.bigBlind;
        // The pot is zeroed the instant it is paid (that is what makes the payout
        // idempotent), so during the result window it is the amount being WON that
        // belongs on screen, not a bare 0.
        const displayPot = potOnScreen(state);
        $('#pot-display').textContent = displayPot;

        // Find me
        const me = state.players.find(p => p.id === state.myId);
        const others = state.players.filter(p => p.id !== state.myId);

        // Opponents
        const oppContainer = $('#opponents');
        oppContainer.innerHTML = '';
        for (const p of others) {
            const div = document.createElement('div');
            div.className = 'opponent';
            if (state.currentPlayerIndex >= 0 && state.players[state.currentPlayerIndex]?.id === p.id && state.phase > PHASE.WAITING && state.phase < PHASE.SHOWDOWN) {
                div.classList.add('active-turn');
            }
            if (p.folded) div.classList.add('folded');
            if (p.disconnected) div.classList.add('disconnected');

            let dealerChip = '';
            if (state.dealerIndex >= 0 && state.players[state.dealerIndex]?.id === p.id) {
                dealerChip = '<div class="dealer-chip">D</div>';
            }

            let cardsHtml = '<div class="opp-cards">';
            if (p.holeCards && p.holeCards.length > 0) {
                for (const c of p.holeCards) {
                    const cardEl = renderCard(c);
                    cardsHtml += cardEl.outerHTML;
                }
            }
            cardsHtml += '</div>';

            let betStr = '';
            if (p.currentBet > 0) betStr = `<div class="bet-amount">Bet: ${esc(p.currentBet)}</div>`;

            let handLabel = '';
            if (state.phase === PHASE.SHOWDOWN && !p.folded && p.holeCards && p.holeCards[0] !== 'back' &&
                community.length >= 3) {
                const ev = evaluateBestHand(p.holeCards, community);
                handLabel = `<div class="hand-label">${esc(ev.name)}</div>`;
            }

            let statusStr = '';
            if (p.busted) statusStr = '<div class="bet-amount">Out</div>';
            else if (p.folded) statusStr = '<div class="bet-amount">Folded</div>';
            else if (p.allIn) statusStr = '<div class="bet-amount" style="color:var(--color-error)">ALL IN</div>';

            // esc: every one of these strings came off the wire.
            div.innerHTML = `${dealerChip}<div class="name">${esc(p.name)}</div>${cardsHtml}<div class="chips">${esc(p.chips)}</div>${betStr}${statusStr}${handLabel}`;
            oppContainer.appendChild(div);
        }

        // Community cards
        const commContainer = $('#community');
        commContainer.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const card = community[i] || null;
            commContainer.appendChild(renderCard(card, true));
        }

        // Side pots
        const sidePots = $('#side-pots');
        sidePots.innerHTML = '';

        // Main pot label
        const mainPotLabel = $('#main-pot-label');
        if (displayPot > 0 && state.phase > PHASE.WAITING) {
            mainPotLabel.textContent = 'Pot: ' + displayPot;
        } else {
            mainPotLabel.textContent = '';
        }

        // My area
        if (me && !me.busted) {
            $('#my-chips').textContent = me.chips;

            const dealerIsMe = state.dealerIndex >= 0 && state.players[state.dealerIndex]?.id === me.id;
            $('#my-name').textContent = me.name + (dealerIsMe ? ' (D)' : '');

            // My cards
            const myCardsContainer = $('#my-cards');
            myCardsContainer.innerHTML = '';
            if (me.holeCards && me.holeCards.length > 0) {
                for (const c of me.holeCards) {
                    myCardsContainer.appendChild(renderCard(c, true));
                }

                // Show hand evaluation
                if (community.length >= 3 && !me.folded) {
                    const ev = evaluateBestHand(me.holeCards, community);
                    $('#my-hand-label').textContent = ev.name;
                } else {
                    $('#my-hand-label').textContent = '';
                }
            } else {
                $('#my-hand-label').textContent = '';
            }

            // Actions
            renderActions(state, me);
        } else {
            // No seat in this snapshot, or a seat with no chips left. Either way the
            // panel must be cleared: leaving the last hand's cards and buttons frozen
            // there for the rest of the night is what a busted player used to get,
            // with nothing to tell them they were out.
            $('#my-name').textContent = (me ? me.name : (myName || 'You')) + (me ? ' — out' : ' — spectating');
            $('#my-chips').textContent = me ? String(me.chips) : '';
            $('#my-cards').innerHTML = '';
            $('#my-hand-label').textContent = '';
            renderActions(state, null);
        }

        // Announcement
        renderAnnouncement(state);
        syncTurnClock(state);
    }

    function renderActions(state, me) {
        const actionsContainer = $('#actions');
        const raiseControls = $('#raise-controls');
        const raisePresets = $('#raise-presets');
        actionsContainer.innerHTML = '';
        raiseControls.style.display = 'none';
        raisePresets.style.display = 'none';

        const activePhase = state.phase > PHASE.WAITING && state.phase < PHASE.SHOWDOWN;

        // Spectator (busted, removed, or a snapshot that names no seat of ours).
        if (!me) {
            if (activePhase) {
                actionsContainer.innerHTML = '<span style="color:var(--color-text-muted);font-size:0.85rem;">Spectating</span>';
            }
            return;
        }

        // Not my turn or not in an active phase
        const isMyTurn = state.currentPlayerIndex >= 0 &&
            state.players[state.currentPlayerIndex]?.id === me.id &&
            activePhase;

        if (!isMyTurn || me.folded || me.allIn) {
            if (me.folded) {
                actionsContainer.innerHTML = '<span style="color:var(--color-text-muted);font-size:0.85rem;">Folded</span>';
            } else if (me.allIn) {
                actionsContainer.innerHTML = '<span style="color:var(--color-error);font-size:0.85rem;font-weight:600;">ALL IN</span>';
            } else if (activePhase && state.currentPlayerIndex < 0) {
                // The board is dealing itself out: nobody has a decision to make.
                actionsContainer.innerHTML = '<span style="color:var(--color-text-muted);font-size:0.85rem;">Running it out…</span>';
            } else if (activePhase) {
                const waitingFor = state.players[state.currentPlayerIndex]?.name || '...';
                const span = document.createElement('span');
                span.style.color = 'var(--color-text-muted)';
                span.style.fontSize = '0.85rem';
                span.textContent = 'Waiting for ' + waitingFor;
                actionsContainer.appendChild(span);
            }
            return;
        }

        // The decision these buttons are being drawn FOR. Captured here, not read when
        // the finger lands: a button drawn for one decision must never be applied to the
        // next one, whichever seat taps it and however it was dispatched.
        const token = { handNum: state.handNum, turnSeq: state.turnSeq };

        const toCall = state.currentBet - me.currentBet;
        const canCheck = toCall === 0;
        const canCall = toCall > 0;
        const minRaiseTotal = state.currentBet + state.minRaise;
        const canRaise = me.chips > toCall && me.chips + me.currentBet > state.currentBet;

        // Fold
        const foldBtn = document.createElement('button');
        foldBtn.className = 'btn btn-danger';
        foldBtn.textContent = 'Fold';
        foldBtn.onclick = () => sendAction('fold', 0, token);
        actionsContainer.appendChild(foldBtn);

        // Check or Call
        if (canCheck) {
            const checkBtn = document.createElement('button');
            checkBtn.className = 'btn';
            checkBtn.textContent = 'Check';
            checkBtn.onclick = () => sendAction('check', 0, token);
            actionsContainer.appendChild(checkBtn);
        } else if (canCall) {
            const callAmount = Math.min(toCall, me.chips);
            const callBtn = document.createElement('button');
            callBtn.className = 'btn btn-success';
            callBtn.textContent = callAmount >= me.chips ? `Call All-In (${callAmount})` : `Call (${callAmount})`;
            callBtn.onclick = () => {
                if (callAmount >= me.chips) {
                    sendAction('allin', 0, token);
                } else {
                    sendAction('call', 0, token);
                }
            };
            actionsContainer.appendChild(callBtn);
        }

        // Raise
        if (canRaise) {
            const maxRaise = me.chips + me.currentBet;
            const actualMinRaise = Math.min(minRaiseTotal, maxRaise);

            // Show slider
            raiseControls.style.display = 'flex';
            raisePresets.style.display = 'flex';
            const slider = $('#raise-slider');
            slider.min = actualMinRaise;
            slider.max = maxRaise;
            slider.value = actualMinRaise;
            slider.step = state.bigBlind;
            $('#raise-amount').textContent = actualMinRaise;

            slider.oninput = () => {
                $('#raise-amount').textContent = slider.value;
            };

            // Presets
            $$('#raise-presets .btn').forEach(btn => {
                const preset = btn.dataset.preset;
                btn.onclick = () => {
                    let val;
                    if (preset === 'min') val = actualMinRaise;
                    else if (preset === 'max') val = maxRaise;
                    else {
                        val = Math.max(actualMinRaise, Math.floor(state.currentBet + state.pot * parseFloat(preset)));
                        val = Math.min(val, maxRaise);
                        // Round to nearest big blind
                        val = Math.round(val / state.bigBlind) * state.bigBlind;
                        val = Math.max(actualMinRaise, Math.min(val, maxRaise));
                    }
                    slider.value = val;
                    $('#raise-amount').textContent = val;
                };
            });

            if (maxRaise === actualMinRaise) {
                // Can only go all-in
                const allInBtn = document.createElement('button');
                allInBtn.className = 'btn btn-primary';
                allInBtn.textContent = `All In (${me.chips})`;
                allInBtn.onclick = () => sendAction('allin', 0, token);
                actionsContainer.appendChild(allInBtn);
                raiseControls.style.display = 'none';
                raisePresets.style.display = 'none';
            } else {
                const raiseBtn = document.createElement('button');
                raiseBtn.className = 'btn btn-primary';
                raiseBtn.textContent = 'Raise';
                raiseBtn.onclick = () => {
                    const val = parseInt(slider.value);
                    if (val >= maxRaise) {
                        sendAction('allin', 0, token);
                    } else {
                        sendAction('raise', val, token);
                    }
                };
                actionsContainer.appendChild(raiseBtn);
            }
        }
    }

    /* ── Turn countdown ───────────────────────────────────────────────
       The state only arrives when something changes, so the clock is painted from a
       local interval seeded with the REMAINING time the host reported (the two
       clocks are not synced). Tracked and cleared like every other timer here. */
    let turnClockTimer = null;
    let turnClockUntil = 0;
    let turnClockLabel = '';

    function syncTurnClock(state) {
        const active = state.currentPlayerIndex >= 0 &&
            state.phase > PHASE.WAITING && state.phase < PHASE.SHOWDOWN &&
            state.turnRemainingMs != null;
        if (!active) { stopTurnClock(); return; }
        const who = state.players[state.currentPlayerIndex];
        turnClockUntil = Date.now() + state.turnRemainingMs;
        turnClockLabel = (who && who.id === state.myId) ? 'Your turn' : (who ? who.name : '');
        paintTurnClock();
        if (!turnClockTimer) turnClockTimer = setInterval(paintTurnClock, 1000);
    }

    function paintTurnClock() {
        const el = $('#turn-timer');
        const left = Math.max(0, Math.ceil((turnClockUntil - Date.now()) / 1000));
        // The two clocks are not synced, so ours can run out a beat before the host acts
        // for the seat. Say "time" rather than sitting on a stopped "0s".
        el.textContent = left > 0 ? turnClockLabel + ' ' + left + 's' : turnClockLabel + ' — time';
        el.style.display = '';
        if (left <= 0 && turnClockTimer) { clearInterval(turnClockTimer); turnClockTimer = null; }
    }

    function stopTurnClock() {
        if (turnClockTimer) { clearInterval(turnClockTimer); turnClockTimer = null; }
        const el = $('#turn-timer');
        if (el) { el.textContent = ''; el.style.display = 'none'; }
    }

    function renderAnnouncement(state) {
        const ann = $('#announcement');
        if (state.phase === PHASE.SHOWDOWN && state.handResults && state.handResults.length > 0) {
            const result = state.handResults[0];
            const winnerNames = result.winners.map(id => {
                const p = state.players.find(p => p.id === id);
                return p ? p.name : '?';
            }).join(', ');

            $('#announce-title').textContent = winnerNames + ' wins!';
            let text = 'Takes ' + result.amount + ' chips';
            if (result.handName) text += ' with ' + result.handName;
            if (state.handResults.length > 1) {
                for (let i = 1; i < state.handResults.length; i++) {
                    const r = state.handResults[i];
                    const names = r.winners.map(id => state.players.find(p => p.id === id)?.name || '?').join(', ');
                    text += `\nSide pot: ${names} wins ${r.amount}`;
                }
            }
            $('#announce-text').textContent = text;
            ann.classList.add('show');
        } else {
            ann.classList.remove('show');
        }
    }

    function showGameOver(winner) {
        stopTurnClock();
        $('#game-over').classList.add('show');
        if (winner) {
            $('#game-over-title').textContent = winner.name + ' wins the game!';
            $('#game-over-text').textContent = 'Finished with ' + winner.chips + ' chips.';
        } else {
            $('#game-over-title').textContent = 'Game Over';
            $('#game-over-text').textContent = '';
        }
    }

    /**
     * The menu is rebuilt when it is opened, after any action taken from it, and (via
     * hostRefresh) on every state change while it is open — so the seat its buttons name
     * is the seat they act on.
     */
    function renderGameMenu() {
        renderSeatCodes();
        const box = $('#host-controls');
        if (!isHost || !game || game.ended) { box.style.display = 'none'; return; }
        box.style.display = '';

        const foldBox = $('#menu-fold-current');
        foldBox.innerHTML = '';
        const current = game.currentPlayerIndex >= 0 ? game.players[game.currentPlayerIndex] : null;
        if (current) {
            // The decision this button was drawn for, captured now. Acting on whoever
            // happens to be current at CLICK time is the same "second tap lands on the
            // next decision" bug the turn token closes everywhere else.
            const forId = current.id;
            const forHand = game.handNum;
            const forSeq = game.turnSeq;
            const btn = document.createElement('button');
            btn.className = 'btn';
            // textContent, not innerHTML: the name came off the wire.
            btn.textContent = (current.currentBet >= game.currentBet ? 'Check for ' : 'Fold for ') + current.name;
            btn.addEventListener('click', () => {
                const p = game.currentPlayerIndex >= 0 ? game.players[game.currentPlayerIndex] : null;
                if (!p || p.id !== forId || game.handNum !== forHand || game.turnSeq !== forSeq) {
                    toast('The turn has already moved on');
                    renderGameMenu();
                    return;
                }
                game.handleAction(p.id, p.currentBet >= game.currentBet ? 'check' : 'fold',
                    0, { handNum: forHand, turnSeq: forSeq });
                renderGameMenu();
            });
            foldBox.appendChild(btn);
        }

        const list = $('#menu-remove-list');
        list.innerHTML = '';
        for (const p of game.players) {
            if (p.id === myPlayerId) continue;
            const btn = document.createElement('button');
            btn.className = 'btn btn-danger';
            btn.textContent = 'Remove ' + p.name;
            btn.addEventListener('click', () => removeSeat(p.id));
            list.appendChild(btn);
        }
    }

    /**
     * Seat codes. A player whose tab died needs one to get back into a live hand from
     * another device — so their own code is on their own screen, and the host (who can
     * read it out to them) has the whole list.
     */
    function renderSeatCodes() {
        const el = $('#menu-seat-codes');
        if (!el) return;
        if (isHost && game) {
            // `removed`, not `leaving`: a seat is marked leaving when its reconnect
            // window runs out, which is PRECISELY the player who is now asking the host
            // to read their code out — onPlayerJoined accepts that reclaim. Only a
            // deliberate removal is final, and only that may hide the code.
            const lines = game.players
                .filter(p => p.id !== myPlayerId && !p.removed && seatCodes.has(p.id))
                .map(p => p.name + (p.leaving || p.disconnected ? ' (away)' : '') + ': ' + seatCodes.get(p.id));
            el.textContent = lines.length
                ? 'Seat codes — read one out to a player who lost their tab · ' + lines.join(' · ')
                : '';
        } else {
            el.textContent = mySeatCode
                ? 'Your seat code: ' + mySeatCode + ' — use it to rejoin from another device'
                : '';
        }
    }

    /* ══════════════════════════════════════════════════════════════
       EVENT HANDLERS
       ══════════════════════════════════════════════════════════════ */

    // Create table
    $('#btn-create').addEventListener('click', async () => {
        const btn = $('#btn-create');
        const name = $('#host-name').value.trim() || 'Host';
        const buyIn = parseInt($('#buy-in').value) || 1000;
        const sb = parseInt($('#small-blind').value) || 5;
        const bb = parseInt($('#big-blind').value) || 10;
        // BOTH buttons: they share this screen and the single `lobby` global, and a
        // create can sit unresolved for seconds. A tap on the other one in that window
        // used to take the table over underneath this one.
        btn.disabled = true;
        btn.textContent = 'Creating...';
        $('#btn-join').disabled = true;
        // hostGame takes its generation synchronously, before its first await.
        const pending = hostGame(name, { buyIn, smallBlind: sb, bigBlind: bb });
        const gen = tableGen;
        try {
            await pending;
        } catch (e) {
            // Something newer owns the table now: this failure is about a lobby that has
            // already been retired, and touching `lobby` here would tear down the live one.
            if (gen !== tableGen) return;
            toast('Failed: ' + (e && e.message ? e.message : 'could not create the table'));
            if (lobby) { try { lobby.destroy(); } catch (err) {} lobby = null; }
            isHost = false;
            game = null;
        }
        if (gen !== tableGen) return;
        btn.disabled = false;
        btn.textContent = 'Create Table';
        $('#btn-join').disabled = false;
    });

    // Join table
    $('#btn-join').addEventListener('click', async () => {
        const btn = $('#btn-join');
        const name = $('#join-name').value.trim() || 'Player';
        const code = $('#room-code').value.trim();
        const seatCode = $('#rejoin-code').value.trim();
        if (!code) { toast('Enter a room code'); return; }
        btn.disabled = true;
        btn.textContent = 'Connecting...';
        $('#btn-create').disabled = true;
        // joinGame takes its generation synchronously, before its first await.
        const pending = joinGame(name, code, seatCode);
        const gen = tableGen;
        try {
            await pending;
            // Stays disabled until the host answers ('joined'), or until one of the
            // error paths puts us back on this screen through resetToLobby().
        } catch (e) {
            // Something newer owns the table now — the player gave up on this code and
            // tapped Create Table, and that room is live. resetToLobby() from here would
            // destroy it and drop everyone who has joined it.
            if (gen !== tableGen) return;
            // The lobby was torn down under us (another join started, or we left).
            if (e && e.type === 'destroyed') return;
            // A refusal has already been painted with the host's own words by the
            // 'rejected' state / join-error message; do not overwrite it with a
            // generic "check the room code".
            if (!terminalState) toast('Could not join: check the room code');
            resetToLobby();
        }
    });

    // Copy room code
    $('#display-code').addEventListener('click', () => {
        navigator.clipboard?.writeText(roomCode).then(() => toast('Code copied!'));
    });

    // Start game
    $('#btn-start-game').addEventListener('click', () => {
        if (!isHost || !game || game.ended || game.handNum > 0) return;
        if (game.players.filter(p => !p.disconnected && !p.busted).length < 2) {
            toast('Need at least 2 players');
            return;
        }
        $('#btn-start-game').disabled = true;
        showScreen('game');
        // Tell clients
        lobby.broadcast({ type: 'gameStart' });
        game.startHand();
    });

    // Menu
    $('#btn-menu').addEventListener('click', () => {
        renderGameMenu();
        $('#game-menu').classList.add('show');
    });
    $('#btn-menu-close').addEventListener('click', () => {
        $('#game-menu').classList.remove('show');
    });
    $('#btn-leave').addEventListener('click', () => { leaveTable(); });

    // Game over - back to lobby
    $('#btn-back-lobby').addEventListener('click', () => { leaveTable(); });

    // Best effort on tab close: the goodbye goes out synchronously, so players are told
    // the room is over instead of dialling a dead code for minutes.
    window.addEventListener('beforeunload', () => {
        if (leavingTable) return;
        if (isHost && lobby) {
            try { lobby.closeRoom('Host left the table'); } catch (e) {}
            // closeRoom's own cleanup (which forgets the room code) runs on a timer that
            // an unloading page will never reach. Forget it here instead: every player
            // has just been told this room is over, so a reload must come back as a new
            // room rather than resurrecting a code they were all bounced off.
            forgetRoomCode();
        }
    });

    /** The key SlopLobby stores a host tab's room code under. */
    function forgetRoomCode() {
        try { sessionStorage.removeItem(ROOM_CODE_KEY); } catch (e) { /* nothing to forget */ }
    }

    // Enter key on inputs
    $('#room-code').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') $('#btn-join').click();
    });
    $('#rejoin-code').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') $('#btn-join').click();
    });
    $('#host-name').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') $('#btn-create').click();
    });
    $('#join-name').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') $('#room-code').focus();
    });

    // Load saved name
    const savedName = localStorage.getItem('holdem-name');
    if (savedName) {
        $('#host-name').value = savedName;
        $('#join-name').value = savedName;
    }
    // Save name on input
    for (const el of [$('#host-name'), $('#join-name')]) {
        el.addEventListener('input', () => {
            localStorage.setItem('holdem-name', el.value);
            // Sync both
            $('#host-name').value = el.value;
            $('#join-name').value = el.value;
        });
    }

    </script>
</body>
</html>
