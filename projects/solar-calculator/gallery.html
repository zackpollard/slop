const root = document.getElementById('g');

/* ── seeded fake data ─────────────────────────────────────────── */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261005);
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const HH = Array.from({ length: 48 }, (_, i) => `${String(i >> 1).padStart(2, '0')}:${i % 2 ? '30' : '00'}`);

const shape = hr => 0.06 * Math.exp(-(((hr - 7.5) / 1.1) ** 2)) + 0.2 * Math.exp(-(((hr - 18.6) / 1.9) ** 2)) + 0.04 * (hr > 9 && hr < 16 ? 1 : 0);
const LOAD = HH.map((_, i) => 0.241 + shape(i / 2));
const MONTHS = ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09'];

  { id: 'S05', name: 'City Plumbing 2×515 W', route: 'plugin', cost: 468, sav: 151, lo: 132, hi: 164, payback: 3.1, ahead: 1042, conf: 'High' },
  { id: 'S03', name: 'Octopus 2×460 W on a west wall', route: 'plugin', cost: 650, sav: 118, lo: 104, hi: 127, payback: 5.5, ahead: 530, conf: 'High' },
  { id: 'H1', name: 'EcoFlow STREAM Ultra + 4×500 W', route: 'hardwired', cost: 1849, sav: 395, lo: 352, hi: 421, payback: 4.7, ahead: 2101, conf: 'Medium' },
  { id: 'U1', name: 'DELTA 3 Plus for the servers', route: 'ups', cost: 599, sav: 43, lo: 41, hi: 45, payback: 13.9, ahead: -169, conf: 'Medium' },
  { id: 'W1', name: 'Octopus 2×460 + plug-in battery', route: 'whatif', cost: 1700, sav: 380, lo: 340, hi: 405, payback: 4.5, ahead: 2100, conf: 'Low' },
  { id: 'R1', name: 'Cut 100 W of always-on load', route: 'reference', cost: 0, sav: 175, lo: 175, hi: 175, payback: 0, ahead: 1750, conf: 'High' },
];
const routeLabel = { plugin: 'Plug-in', hardwired: 'Electrician', ups: 'Power station', whatif: 'Future rules', reference: 'Reference' };
root.append(section('Table (sortable · card list under 600 px)',
  ui.card({ title: 'Your options, ranked', subtitle: 'Typical-year sunshine · 2% price rise/yr · 4% discount rate', body: ui.table({
    sortKey: '-ahead', onRowClick: r => ui.toast(`Open ${r.name} in Design`),
    rowClass: r => (r.route === 'whatif' ? 'is-muted' : r.id === 'S01' ? 'is-highlight' : ''),
    columns: [
      { key: 'name', label: 'Option', mobile: 'title' },
      { key: 'route', label: 'Route', format: v => ui.badge({ text: routeLabel[v], tone: v }), sortable: false },
      { key: 'cost', label: 'Cost', align: 'right', format: v => fmt.gbp(v) },
      { key: 'sav', label: 'Saves/yr', align: 'right', format: (v, r) => `${fmt.gbp(v)} (${fmt.range(r.lo, r.hi, fmt.gbp)})`, mobile: 'primary' },
      { key: 'payback', label: 'Payback', align: 'right', format: v => (v === 0 ? 'now' : fmt.years(v)) },
      { key: 'ahead', label: 'Ahead after 10 yrs', align: 'right', format: v => fmt.gbp(v) },
      { key: 'conf', label: 'Confidence', mobile: 'hide' },
    ], rows: OPTIONS }) })));

/* ── disclosure, progress, skeleton, empty, overlays ──────────── */
const pl = ui.progressList(ui.LOAD_STEPS);
const runProgress = () => {
  const steps = [['account', 'done', 'A-1234ABCD · London · AGILE-24-10-01'], ['usage', 'done', '17,402 half-hours (99%)'], ['prices', 'done', '17,520'], ['export', 'done', ''], ['weather', 'active', '212 days'], ['weather', 'done', '365 days'], ['climatology', 'error', 'Open-Meteo timed out'], ['build', 'skip', '']];
  ui.LOAD_STEPS.forEach(s => pl.set(s.key, 'pending', ''));
  steps.forEach(([k, s, d], i) => setTimeout(() => pl.set(k, s, d), 250 * (i + 1)));
};
runProgress();
root.append(section('Disclosure · progress · skeleton · empty · overlays',
  h('div', { class: 'grid-2' },
    ui.card({ title: 'Your questions', body: h('div', null,
      ui.details({ summary: h('span', null, h('b', null, 'Should the panels face west for the 4–7pm peak? '), h('span', { class: 'muted' }, 'No — face them SSW.')), body: h('p', null, 'On a west-facing wall they’d make 512 kWh/yr instead of 742 (31% less). Each of those kWh is worth more (22.9p vs 21.4p) because 34% lands in the 4–7pm peak, but that doesn’t make up for the lost energy.'), open: true }),
      ui.details({ summary: 'What does a battery add?', body: h('p', null, 'A battery adds £223/yr for £1,199 more — the extra pays back in 5.4 years.') }),
      ui.details({ summary: 'How sure is this?', body: h('p', null, 'How sure: high. Weather alone moves it between £150 and £186 a year.') })) }),
    h('div', { class: 'stack' },
      ui.card({ title: 'Progress list', actions: ui.button({ label: 'Replay', size: 'sm', kind: 'ghost', icon: 'refresh', onClick: runProgress }), body: pl.el }),
      ui.card({ title: 'Skeleton', body: h('div', { class: 'stack-sm' }, ui.skeleton({ lines: 3 }), ui.skeleton({ height: 64 })) }),
      ui.card({ body: h('div', { class: 'g-row' },
        ui.button({ label: 'Toast', onClick: () => ui.toast('Saved “Octopus 2×460 on the flat roof”', { tone: 'good', action: { label: 'Undo', onClick: () => ui.toast('Undone') } }) }),
        ui.button({ label: 'Error toast', onClick: () => ui.toast('Octopus didn’t accept that key.', { tone: 'bad' }) }),
        ui.button({ label: 'Modal', onClick: () => ui.modal({ title: 'Reset everything?', body: h('p', null, 'This forgets your settings, saved scenarios and API key on this device.'), actions: [{ label: 'Cancel' }, { label: 'Reset', danger: true, onClick: () => ui.toast('Reset (not really — gallery)') }] }) })) })),
  ),
  h('div', { style: { marginTop: '20px' } }, ui.card({ body: ui.emptyState({ title: 'Nothing pays back within 10 years', body: 'Closest: City Plumbing 2×515 W, 11.2 years. Cutting 100 W of always-on load would save £175/yr for nothing.', action: { label: 'See all options', onClick: () => ui.toast('→ #compare') } }) }))));

/* ── connect card ─────────────────────────────────────────────── */
const fakeCtx = {
  store: { get: () => ({ connection: { demoServerW: 500, rememberKey: false, location: {} } }), set() {} },
  data: {
    load(spec, { onProgress } = {}) {
      const steps = spec.kind === 'demo' ? ['usage', 'prices', 'weather', 'build'] : ['account', 'usage', 'prices', 'export', 'weather', 'climatology', 'build'];
      return new Promise((resolve, reject) => {
        steps.forEach((s, i) => {
          setTimeout(() => onProgress?.({ step: s, status: 'start' }), 300 * i);

            if (spec.apiKey === 'sk_live_fail' && s === 'account') { onProgress?.({ step: s, status: 'error' }); reject(Object.assign(new Error('This key can see more than one account — pick one.'), { name: 'DataError', code: 'ACCOUNT', action: 'pickAccount', choices: ['A-1234ABCD', 'A-9876ZYXW'] })); return; }
            onProgress?.({ step: s, status: 'done', count: s === 'usage' ? 17402 : undefined, pct: s === 'usage' ? 99.3 : undefined });
            if (i === steps.length - 1) { ui.toast('Loaded (gallery stub)', { tone: 'good' }); resolve({}); }
          }, 300 * i + 240);
        });
      });
    },
  },
};
root.append(section('Connect card (stub data hub — key “sk_live_fail” shows the error path)', ui.connectCard(fakeCtx)));

/* ── charts ───────────────────────────────────────────────────── */
const gridCharts = h('div', { class: 'grid-2' });

// 1. Load profile above price profile (two charts sharing x, never a dual axis)
wide.append(ui.card({ eyebrow: 'Usage', title: 'An average day: your load, then the price', subtitle: '48 half-hours, local time. Shaded: the 4–7pm Agile peak.', body: h('div', { class: 'stack-sm' },
  (() => { const e = h('div'); queueMicrotask(() => charts.createLine(e, { ariaLabel: 'Average load by half-hour', height: 190, x: { values: HH }, y: { label: 'kWh per half-hour', format: v => fmt.num(v, 2) }, series: [{ key: 'load', label: 'Your load', color: 'load', values: LOAD, area: true }], bands: [{ from: 32, to: 38, label: '4–7pm' }], legendMin: 2 })); return e; })(),
  (() => { const e = h('div'); queueMicrotask(() => charts.createLine(e, { ariaLabel: 'Average Agile price by half-hour', height: 190, x: { values: HH }, y: { label: 'p/kWh', format: v => fmt.num(v, 0) }, series: [{ key: 'price', label: 'Agile price', color: 'price', values: PRICE, format: v => fmt.p(v) }], bands: [{ from: 32, to: 38 }] })); return e; })()) }));

// 2. Typical day stacked area
const day = HH.map((_, i) => {
  const hr = i / 2 + 0.25;
  const sun = Math.max(0, Math.sin(Math.PI * (hr - 4.9) / 16.2));
  const dc = 0.47 * sun ** 1.25;
  const pv = Math.min(0.4, dc);
  const load = 0.25 + shape(hr) * 0.9;
  const used = Math.min(pv, load);
  const batt = i >= 32 && i < 38 ? Math.min(load - used, 0.21) : 0;
  return { used, batt, imp: Math.max(0, load - used - batt), exp: Math.max(0, pv - used), clip: Math.max(0, dc - 0.4), load };
});
wide.append(ui.card({ eyebrow: 'Design', title: 'Typical summer day', subtitle: 'How your load is met, plus what goes out and what is lost — 21 Jun', body: (() => { const e = h('div'); queueMicrotask(() => charts.createStackedArea(e, {
  ariaLabel: 'Typical summer day energy flows', x: { values: HH }, y: { label: 'kWh per half-hour', format: v => fmt.num(v, 2) }, totalLabel: 'Total shown',

gridCharts.append(chartCard('What moves the payback', 'Payback in years at each driver’s low and high setting', e => charts.createTornado(e, {

    { label: 'Shading', low: 3.6, high: 4.5, lowLabel: '0%', highLabel: '15%' },

// 7. Heatmaps 365 × 48
const DAYS = 365;
const dates = Array.from({ length: DAYS }, (_, d) => new Date(Date.UTC(2025, 9, 1 + d)).toISOString().slice(0, 10));
const loadHm = new Float32Array(DAYS * 48), priceHm = new Float32Array(DAYS * 48);
for (let d = 0; d < DAYS; d++) {
  const season = Math.cos(2 * Math.PI * (d - 100) / 365);   // +1 mid-winter
  const weekend = new Date(Date.UTC(2025, 9, 1 + d)).getUTCDay() % 6 === 0;
  for (let k = 0; k < 48; k++) {
    loadHm[d * 48 + k] = Math.max(0.15, 0.24 + shape(k / 2) * (1 + 0.35 * season + (weekend ? 0.25 : 0)) + 0.025 * gauss());
    const solarDip = Math.max(0, Math.sin(Math.PI * (k / 2 - 6) / 12)) * (1 - season) * 6;
    priceHm[d * 48 + k] = PRICE[k] * (1 + 0.18 * season) - solarDip + 2.4 * gauss();
  }
  if (d === 40) for (let k = 0; k < 48; k++) loadHm[d * 48 + k] = NaN;   // a missing day
}
wide.append(chartCard('Your load, every half-hour of the year', 'Days run left to right, time of day top to bottom. Grey = no data.', e => charts.createHeatmap(e, {
  rows: DAYS, cols: 48, values: loadHm, rowLabels: dates, colLabels: HH, transpose: true, height: 240, valueLabel: 'kWh', format: v => `${fmt.num(v, 2)} kWh`, scale: { ramp: 'sequential' } })));
wide.append(chartCard('Agile price, every half-hour', 'Blue: cheaper than the 20p average · orange: dearer', e => charts.createHeatmap(e, {
  rows: DAYS, cols: 48, values: priceHm, rowLabels: dates, colLabels: HH, transpose: true, height: 240, valueLabel: 'p/kWh', format: v => fmt.p(v), scale: { ramp: 'diverging', mid: 20 } })));

// 8. Solar rose
const AZ = Array.from({ length: 19 }, (_, i) => 90 + i * 10), TI = Array.from({ length: 19 }, (_, i) => i * 5);
const yieldModel = (az, tilt) => {
  const dAz = (az - 180) * Math.PI / 180, t = tilt * Math.PI / 180;
  const dir = 1 - 0.4 * Math.sin(t) * (1 - Math.cos(dAz - 0.26));
  const tf = 0.86 + 0.14 * Math.cos((tilt - 38) * Math.PI / 100);
  const kwh = 860 * dir * tf;
  const pPer = 21.2 + 3.4 * Math.max(0, Math.sin(dAz)) * Math.sin(t);    // west-facing kWh are worth more
  return { kwh, gbp: kwh * pPer / 100, pPer };
};
const roseVals = new Float64Array(AZ.length * TI.length);
let best = { gbp: -1 };
AZ.forEach((a, i) => TI.forEach((t, j) => { const m = yieldModel(a, t); roseVals[i * TI.length + j] = m.gbp; if (m.gbp > best.gbp) best = { ...m, az: a, tilt: t }; }));
gridCharts.append(chartCard('The solar rose', '£ saved a year by direction (around) and tilt (flat centre → vertical rim)', e => charts.createPolar(e, {
  azimuths: AZ, tilts: TI, values: roseVals, metricLabel: '£/yr', format: v => fmt.gbp(v),
  markers: [{ az: best.az, tilt: best.tilt, label: `Best £${Math.round(best.gbp)}`, kind: 'best' }, { az: 180, tilt: 35, label: 'Current', kind: 'current' }, { az: 270, tilt: 90, label: 'W90', kind: 'reference' }, { az: 180, tilt: 45, label: 'S45', kind: 'reference' }],
  onPick: (az, tilt) => ui.toast(`Use ${fmt.compass(az)} ${az}° at ${tilt}°`) })));
const AZF = Array.from({ length: 24 }, (_, i) => i * 15), TIF = Array.from({ length: 10 }, (_, i) => i * 10);
const fullVals = new Float64Array(AZF.length * TIF.length);
AZF.forEach((a, i) => TIF.forEach((t, j) => { fullVals[i * TIF.length + j] = yieldModel(a, t).kwh * (1 - 0.35 * Math.max(0, Math.cos(a * Math.PI / 180)) * Math.sin(t * Math.PI / 180)); }));
gridCharts.append(chartCard('Full-circle rose', 'kWh/yr in every direction (N up, E right)', e => charts.createPolar(e, {
  azimuths: AZF, tilts: TIF, values: fullVals, metricLabel: 'kWh/yr', format: v => fmt.kwh(v), scale: { ramp: 'sequential' },
  markers: [{ az: 195, tilt: 40, label: 'Best kWh', kind: 'best' }, { az: 90, tilt: 90, label: 'E90', kind: 'reference' }] })));

// 9. Cost vs saving scatter with payback isolines
const SC = [
  ...OPTIONS.map(o => ({ x: o.cost, y: o.sav, label: o.name, route: o.route, whisker: o.route === 'reference' ? null : [o.lo, o.hi], emphasis: o.id === 'S01' || o.id === 'H1' })),
  { x: 450, y: 98, label: 'Octopus 1×460 W', route: 'plugin', whisker: [86, 106] }, { x: 336, y: 92, label: 'City Plumbing 1×465 W', route: 'plugin', whisker: [81, 99] },
  { x: 1934, y: 420, label: 'Zendure 2400 Pro + 4×460', route: 'hardwired', whisker: [372, 448] }, { x: 2534, y: 470, label: 'Anker Solarbank 4 Pro', route: 'hardwired', whisker: [420, 500] },
  { x: 1299, y: 61, label: 'BLUETTI Elite 300', route: 'ups', whisker: [58, 64] }, { x: 841, y: 118, label: 'DELTA 3 Plus + 2×460 W', route: 'ups', whisker: [104, 128] },
];
const isos = [2, 3, 5, 10].map(n => ({ label: `pays back in ${n} yrs`, points: [[0, 0], [3000, 3000 / n]] }));
const front = SC.filter(p => p.route !== 'whatif' && p.route !== 'reference').filter((p, _, all) => !all.some(q => q !== p && q.x <= p.x && q.y >= p.y && (q.x < p.x || q.y > p.y))).map(p => [p.x, p.y]);
wide.append(chartCard('Cost vs yearly saving', 'Typical year · whiskers: 2006–2025 weather · dashed: payback lines · joined: the best value at each price', e => charts.createScatter(e, {
  points: SC, isolines: isos, front, x: { label: 'Upfront cost', format: v => fmt.gbp(v, { compact: true }) }, y: { label: '£ saved a year', format: v => fmt.gbp(v) }, whiskerLabel: 'weather range',
  onPick: p => ui.toast(`Open ${p.label}`) })));

// 10. Energy vs value scatter
const cells = [];
AZ.forEach((a, i) => TI.forEach((t, j) => { if (i % 2 === 0 && j % 2 === 1) { const m = yieldModel(a, t); cells.push({ x: m.kwh, y: m.pPer, label: `${fmt.compass(a)} ${a}° · ${t}°`, color: 'muted' }); } }));
const named = [['Best £', best.az, best.tilt, true], ['S35', 180, 35], ['SSW45', 200, 45], ['W45', 270, 45], ['W90', 270, 90, true]].map(([lab, a, t, em]) => { const m = yieldModel(a, t); return { x: m.kwh, y: m.pPer, label: lab, color: 'pv', emphasis: !!em, showLabel: true }; });
gridCharts.append(chartCard('Energy vs value', 'kWh made against what each kWh is worth; dashed curves are equal £/yr', e => charts.createScatter(e, {
  points: [...cells, ...named], x: { label: 'kWh a year', format: v => fmt.num(v), zero: false }, y: { label: 'p per kWh made', format: v => fmt.num(v, 1), zero: false },
  isolines: [100, 125, 150, 175].map(G => ({ label: `£${G}/yr`, points: Array.from({ length: 40 }, (_, k) => { const x = 300 + k * 25; return [x, 100 * G / x]; }) })),
  legend: [{ label: 'Every direction tried', color: 'muted' }, { label: 'Named directions', color: 'pv' }] })));

// 11. Cumulative cash flow
const years = Array.from({ length: 21 }, (_, y) => y);
const cf = (sav, cap) => years.map(y => -cap + Array.from({ length: y }, (_, k) => sav * 1.02 ** k * (1 - 0.004 * k)).reduce((a, b) => a + b, 0));
gridCharts.append(chartCard('Money back over 20 years', 'Cumulative, nominal £ · dashed: wettest and sunniest weather years', e => charts.createLine(e, {
  x: { values: years, type: 'linear', label: 'Years after install', format: v => `${v}` , tipFormat: v => `Year ${v}` }, y: { format: v => fmt.gbp(v, { compact: true }) },
  series: [{ key: 'p50', label: 'Typical', color: 'pv', values: cf(172, 650), area: true }, { key: 'p10', label: 'Dull years', color: 'muted', values: cf(150, 650), dash: true }, { key: 'p90', label: 'Sunny years', color: 'muted', values: cf(186, 650), dash: [2, 3] }],
  markers: [{ x: 3.8, label: 'pays back · 3.8 yrs' }, { x: 12, label: 'new micro-inverter' }] })));

// 12. Base-load curve
const xs = [0, 100, 200, 300, 400, 500, 600, 800, 1000, 1200, 1500];
const sat = (x, cap, k) => cap * (1 - Math.exp(-x / k));
gridCharts.append(chartCard('How much your always-on load matters', '£ saved a year at different always-on loads', e => charts.createLine(e, {
  x: { values: xs, type: 'linear', label: 'Always-on load (W)', format: v => fmt.num(v) , tipFormat: v => `${fmt.w(v)} always-on` }, y: { format: v => fmt.gbp(v) },
  series: [{ key: 'S01', label: 'Octopus 2×460', color: 'cat1', values: xs.map(x => sat(x, 185, 260) + 6) }, { key: 'H1', label: 'STREAM Ultra + 4×500', color: 'cat2', values: xs.map(x => sat(x, 430, 420) + 30) }, { key: 'U1', label: 'DELTA 3 Plus', color: 'cat3', values: xs.map(x => Math.max(0, sat(x, 70, 500) - 12)) }],
  markers: [{ x: 482, label: 'you now' }], bands: [{ from: 800, to: 1500, label: 'all of an 800 W kit used at home' }] })));

/* ── map ──────────────────────────────────────────────────────── */
const mapBox = h('div', { style: { height: '280px' } });
const azBox = h('div', { style: { height: '280px' } });
root.append(section('Map (Leaflet loads from cdnjs only when asked)', h('div', { class: 'grid-2' },
  ui.card({ title: 'Location', actions: ui.button({ label: 'Load map', size: 'sm', onClick: async () => { const m = await import('./js/map.js'); m.createLocationMap(mapBox, { lat: 51.5072, lon: -0.1276, onChange: p => ui.toast(`${p.lat}, ${p.lon}`) }).catch(err => ui.toast(err.message, { tone: 'bad' })); } }), body: mapBox }),
  ui.card({ title: 'Azimuth handle', actions: ui.button({ label: 'Load map', size: 'sm', onClick: async () => { const m = await import('./js/map.js'); m.createAzimuthPicker(azBox, { lat: 51.5072, lon: -0.1276, azimuth: 200, onChange: az => ui.toast(`Facing ${fmt.compass(az)} ${az}°`) }).catch(err => ui.toast(err.message, { tone: 'bad' })); } }), body: azBox }))));

/* ── print-token preview ──────────────────────────────────────── */
document.getElementById('print-toggle').addEventListener('click', () => {
  const html = document.documentElement;
  if ('print' in html.dataset) delete html.dataset.print; else html.dataset.print = '';
  charts.rerenderAll();
});
// Real printing, as app.js does it: paper tokens + every chart's table twin.
window.addEventListener('beforeprint', () => { document.documentElement.dataset.print = ''; charts.setPrintMode(true); });
window.addEventListener('afterprint', () => { delete document.documentElement.dataset.print; charts.setPrintMode(false); });
</script>
